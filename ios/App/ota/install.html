<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安装公考辅导</title>
<style>
  body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
  .card { background: #fff; border-radius: 20px; padding: 40px 32px; text-align: center; box-shadow: 0 2px 20px rgba(0,0,0,.08); max-width: 320px; width: 90%; }
  .icon { width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(135deg, #1A73E8, #4A9EFF); color: #fff; font-size: 36px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  h1 { font-size: 22px; margin: 0 0 8px; color: #1a1a1a; }
  p { color: #888; font-size: 14px; margin: 0 0 28px; line-height: 1.5; }
  .btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 14px; background: #1A73E8; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .btn:active { opacity: 0.85; }
  .hint { font-size: 11px; color: #bbb; margin-top: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📚</div>
  <h1>公考辅导</h1>
  <p>AI 大模型驱动备考<br>版本 1.0</p>
  <a class="btn" href="itms-services://?action=download-manifest&url=https://downloads.example.org/manifest.plist">点击安装</a>
  <div class="hint">安装完成后，前往 设置 → 通用 → VPN与设备管理 → 信任证书</div>
</div>
</body>
</html>
