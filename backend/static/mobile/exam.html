<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>公考辅导 - 模考</title>
<link rel="stylesheet" href="common.css">
<style>
  .status-bar { padding: 8px 12px; font-size: 12px; color: var(--text-secondary); background: var(--accent-soft); border-radius: 8px; text-align: center; }
  .subject-toggle { display:flex;gap:0;background:var(--surface2);border-radius:10px;padding:3px;width:100%; }
  .subject-btn { flex:1;height:36px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:var(--text-secondary);border-radius:8px;transition:all .15s; }
  .subject-btn.active { background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .history-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .history-item { display: flex; align-items: center; padding: 14px 0; gap: 12px; border-bottom: 1px solid var(--border-light); cursor: pointer; }
  .history-item:active { opacity: .7; }
  .hi-left { flex: 1; }
  .hi-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .hi-time { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
  .hi-score { font-size: 18px; font-weight: 700; color: var(--accent); text-align: right; }
  .hi-score span { display: block; font-size: 11px; color: var(--text-secondary); font-weight: 400; }
  .exam-card-inner { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .exam-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; max-width: 280px; }
  .empty-history { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 13px; }
  .stats-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 999; display: flex; align-items: center; justify-content: center; }
  .stats-modal { background: var(--surface); border-radius: 14px; padding: 24px; width: 90%; max-width: 320px; }
  .stats-modal h3 { font-size: 17px; margin-bottom: 16px; }
  .stats-row { display: flex; justify-content: space-around; text-align: center; margin-bottom: 16px; }
  .stat-val { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .btn-close { width: 100%; height: 40px; border: none; border-radius: 10px; background: var(--surface2); color: var(--text-secondary); font-size: 14px; cursor: pointer; font-family: inherit; }
  .type-btn.sel { border-color: transparent; background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
</style>
</head>
<body>
<div class="page">
  <div class="navbar" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:6px">
      <i data-lucide="monitor" style="color:var(--accent);width:20px;height:20px"></i>
      <span class="title">模拟考试</span>
    </div>
    <div class="navbar-actions" style="display:flex;align-items:center;gap:0">
      <button data-task-bell onclick="API.openTaskPanel()" style="position:static;background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:4px;display:flex;align-items:center" title="消息"><i data-lucide="bell" style="width:18px;height:18px"></i><span class="task-badge"></span></button>
      <span style="position:relative">
        <button onclick="toggleExamMenu(event)" style="background:none;border:none;cursor:pointer;color:var(--text);padding:4px;display:flex;align-items:center;border-radius:50%"><i data-lucide="more-vertical" style="width:18px;height:18px"></i></button>
        <div class="menu-dd" id="exam-menu">
          <div class="menu-dd-item" onclick="closeExamMenu();refreshExam()"><i data-lucide="refresh-cw"></i> 刷新</div>
          <div class="menu-dd-item" onclick="closeExamMenu();showExamHistory()"><i data-lucide="history"></i> 历史模考</div>
          <div class="menu-dd-item" onclick="closeExamMenu();showStats()"><i data-lucide="bar-chart-2"></i> 统计</div>
          <div class="menu-dd-item" onclick="closeExamMenu();deleteLastExam()" style="color:var(--red)"><i data-lucide="trash-2"></i> 删除最近模考</div>
        </div>
      </span>
    </div>
  </div>

  <div class="status-bar" id="exam-status">加载中...</div>
  <div id="exam-loading" style="display:none"></div>

  <div class="card exam-card-inner">
    <i data-lucide="sparkles" style="width:20px;height:20px;color:var(--accent)"></i>
    <div style="font-size:16px;font-weight:700;color:var(--text)">AI 模考直通车</div>
    <div class="exam-desc">AI 根据你的备考数据，生成完整行测/申论套卷，模拟真实考场环境</div>

    <div style="width:100%;">
      <div class="subject-toggle" style="margin-bottom:12px">
        <button class="subject-btn active" id="subj-xc" onclick="switchSubj('行测')">行测</button>
        <button class="subject-btn" id="subj-sl" onclick="switchSubj('申论')">申论</button>
      </div>
      <button class="card-btn" onclick="showGenModal()"><i data-lucide="rocket"></i> 生成新试卷</button>
    </div>
  </div>

  <div class="card">
    <div class="history-title"><i data-lucide="book-open" style="width:16px;height:16px;color:var(--accent)"></i> 我的模考记录</div>
    <div id="exam-list"></div>
    <div class="empty-history" id="empty-hint" style="display:none">还没有模考记录</div>
  </div>
</div>

<div class="tabs"></div>

<script src="lucide.js"></script>
<script src="marked.js"></script>
<script src="common.js"></script>
<script>
API.initPage('exam');

let subj = '行测';
let examFiles = [];
let examStats = { total: 0, scores: [] };

async function getExamFiles(subject) {
  var indexed = await API.Index.mocks(subject);
  if (indexed.length) {
    return indexed.map(function(item) { return { name: item.path.split('/').pop(), path: item.path }; });
  }
  // Compatibility for mock papers created before the metadata index existed.
  var allPaths = await API.listFiles('练习/模拟考试/' + subject + '/');
  return allPaths.filter(function(path) { return path.endsWith('.md'); }).sort(function(a,b) { return b.localeCompare(a); }).map(function(path) {
    return { name: path.split('/').pop(), path: path };
  });
}

function toggleExamMenu(e) {
  if (e) e.stopPropagation();
  var m = document.getElementById('exam-menu');
  var wasOpen = m.classList.contains('show');
  document.querySelectorAll('.menu-dd.show').forEach(function(x) { x.classList.remove('show'); });
  if (!wasOpen) {
    m.classList.add('show');
    setTimeout(function() {
      document.addEventListener('click', function close() {
        m.classList.remove('show');
        document.removeEventListener('click', close);
      });
    }, 0);
  }
}

async function showExamHistory() {
  closeExamMenu();
  var o = document.createElement('div'); o.className = 'sheet-overlay'; o.id = 'exam-hist-overlay';
  var h = '<div class="sheet-card" style="max-width:500px;gap:10px" onclick="event.stopPropagation()">';
  h += '<div class="sheet-title">历史模拟考试</div><div id="exam-hist-list" style="max-height:60vh;overflow-y:auto;text-align:center;padding:24px"><i data-lucide="loader" style="animation:spin 1s linear infinite;width:20px;height:20px"></i></div>';
  h += '<button style="height:42px;border:none;border-radius:10px;background:var(--surface2);color:var(--text-secondary);cursor:pointer;font-family:inherit;font-size:14px" onclick="this.closest(\'.sheet-overlay\').remove()">关闭</button></div>';
  o.innerHTML = h; o.addEventListener('click', function(e){if(e.target===o)o.remove()}); document.body.appendChild(o);
  try {
    var l = '';
    var files = await getExamFiles(subj);
    var g={}; files.forEach(function(file){var d=file.name.replace('.md','');var m=d.substring(0,7);if(!g[m])g[m]=[];g[m].push(d)});
    Object.keys(g).sort(function(a,b){return b.localeCompare(a)}).forEach(function(m){l+='<div style="font-size:11px;font-weight:600;color:var(--text-secondary);padding:8px 0 4px">'+m+'</div>';g[m].forEach(function(d){l+='<div style="padding:10px 0;border-bottom:1px solid var(--border-light);cursor:pointer;font-size:14px" onclick="openExam(\''+d+'\');var x=document.getElementById(\'exam-hist-overlay\');if(x)x.remove()">'+d.substring(8)+'日 <i data-lucide="chevron-right" style="width:14px;height:14px;color:var(--border);float:right"></i></div>'});});
    o.querySelector('#exam-hist-list').innerHTML = l||'<div style="text-align:center;padding:28px 16px;color:var(--text-secondary);font-size:13px"><i data-lucide="folder-open" style="width:24px;height:24px;display:block;margin:0 auto 8px;opacity:.3"></i>暂无历史模考</div>';
  } catch(e) { o.querySelector('#exam-hist-list').innerHTML = '<div style="text-align:center;padding:28px 16px;color:var(--text-secondary);font-size:13px"><i data-lucide="folder-open" style="width:24px;height:24px;display:block;margin:0 auto 8px;opacity:.3"></i>加载失败</div>'; }
  lucide.createIcons();
}

function closeExamMenu() {
  var m = document.getElementById('exam-menu');
  if (m) m.classList.remove('show');
}

function refreshExam() {
  document.getElementById('exam-list').innerHTML = '<div style="text-align:center;padding:10px;color:var(--text-secondary)">刷新中...</div>';
  loadHistory();
}

async function deleteLastExam() {
  if (!examFiles.length) { API.toast('没有可删除的模考'); return; }
  var last = examFiles[0];
  var name = last.name.replace('.md','');
  // Custom confirm dialog (native confirm unreliable in WebView)
  var m = document.createElement('div');
  m.id = 'exam-del-confirm';
  m.style.cssText = 'position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center';
  m.innerHTML = '<div style="background:var(--surface);border-radius:14px;padding:24px;width:85%;max-width:300px"><h3 style="margin:0 0 8px;font-size:16px">删除确认</h3><p style="font-size:13px;color:var(--text-secondary);margin:0 0 16px">确认删除 ' + name + ' 的模考试卷？</p><div style="display:flex;gap:8px"><button id="exam-cancel-del" style="flex:1;height:40px;border:none;border-radius:10px;background:var(--surface2);color:var(--text-secondary);font-size:14px;cursor:pointer;font-family:inherit">取消</button><button id="exam-do-del" style="flex:1;height:40px;border:none;border-radius:10px;background:var(--red);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">删除</button></div></div>';
  m.addEventListener('click', function(e) { if (e.target === m) m.remove(); });
  document.body.appendChild(m);
  document.getElementById('exam-cancel-del').onclick = function() { m.remove(); };
  document.getElementById('exam-do-del').onclick = async function() {
    m.remove();
    try {
      await API.deleteFile(last.path);
      API.toast('已删除');
      loadHistory();
    } catch(e) { API.toast('删除失败'); }
  };
}

function switchSubj(s) {
  subj = s;
  document.getElementById('subj-xc').classList.toggle('active', s === '行测');
  document.getElementById('subj-sl').classList.toggle('active', s === '申论');
  loadHistory();
}

// ---- Generation modal ----
async function showGenModal() {
  var date = API.getLocalDate();
  var isXc = subj === '行测';

  // Read exam config from 备考计划.json
  var defaultCount = 100;
  try {
    var plan = await API.fetchJSON('备考计划.json');
    if (plan && plan.exam_info && plan.exam_info.total_questions) {
      defaultCount = plan.exam_info.total_questions;
    } else if (plan && plan.exam_info && plan.exam_info.count) {
      defaultCount = plan.exam_info.count;
    }
  } catch(e) {}

  var overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.id = 'exam-gen-overlay';

  var html = '<div class="sheet-card" style="padding:22px 20px calc(22px + env(safe-area-inset-bottom))" onclick="event.stopPropagation()">';

  if (isXc) {
    // ── 行测套卷 ──
    html += '<div class="sheet-title">行测模考试卷</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);text-align:center;line-height:1.5">AI 根据备考阶段，生成完整行测套卷</div>';

    // 题量方案
    var schemes = [
      { label: '国考标准', count: 135, desc: '135题 · 120分钟' },
      { label: '省考标准', count: 120, desc: '120题 · 120分钟' },
      { label: '精简版',   count: 60,  desc: '60题 · 60分钟' }
    ];
    var defaultScheme = schemes.find(function(s){ return s.count === defaultCount; }) || schemes[1];
    html += '<div style="font-size:12px;color:var(--text-secondary)">题量方案</div>';
    html += '<div style="display:flex;gap:8px" id="exam-gen-schemes">';
    schemes.forEach(function(s) {
      var sel = s.count === defaultScheme.count;
      html += '<button class="gen-scheme-btn" data-count="' + s.count + '" style="flex:1;padding:10px 4px;border:none;border-radius:10px;background:' + (sel?'var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08)':'var(--surface2)') + ';cursor:pointer;font-family:inherit;text-align:center;line-height:1.3"><span style="display:block;font-size:14px;font-weight:700;color:' + (sel?'var(--accent)':'var(--text)') + '">' + s.label + '</span><span style="font-size:10px;color:' + (sel?'var(--accent)':'var(--text-secondary)') + '">' + s.desc + '</span></button>';
    });
    html += '</div>';

    // 侧重点 tags
    html += '<div style="font-size:12px;color:var(--text-secondary)">侧重方向 <span style="font-weight:400">（可多选）</span></div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px" id="exam-gen-tags"></div>';

  } else {
    // ── 申论模考 ──
    html += '<div class="sheet-title">申论模考试卷</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);text-align:center;line-height:1.5">AI 生成申论真题材料，模拟考场写作</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary)">题型</div>';
    html += '<div style="display:flex;gap:8px">';
    html += '<button class="type-btn sel" id="exam-essay-short" style="flex:1;height:42px;border:none;border-radius:10px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">小题</button>';
    html += '<button class="type-btn" id="exam-essay-long" style="flex:1;height:42px;border:none;border-radius:10px;background:var(--surface2);color:var(--text-secondary);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">大作文</button>';
    html += '</div>';
  }

  // Date
  html += '<div style="font-size:12px;color:var(--text-secondary)">日期</div>';
  html += '<input type="date" id="exam-gen-date" value="' + date + '" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--surface2);color:var(--text);font-family:inherit;box-sizing:border-box;color-scheme:normal">';

  // Actions
  html += '<div style="display:flex;gap:8px">';
  html += '<button style="flex:1;height:44px;border:none;border-radius:10px;background:var(--surface2);color:var(--text-secondary);cursor:pointer;font-family:inherit;font-size:15px" onclick="document.getElementById(\'exam-gen-overlay\').remove()">取消</button>';
  html += '<button style="flex:1;height:44px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600" id="exam-gen-confirm">开始模考</button>';
  html += '</div></div>';

  overlay.innerHTML = html;
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);

  if (isXc) {
    var selCount = defaultScheme.count;
    document.querySelectorAll('#exam-gen-schemes .gen-scheme-btn').forEach(function(btn) {
      btn.onclick = function() {
        document.querySelectorAll('#exam-gen-schemes .gen-scheme-btn').forEach(function(b) {
          b.style.background = 'var(--surface2)'; b.style.boxShadow = 'none';
          b.querySelector('span:first-child').style.color = 'var(--text)';
          b.querySelector('span:last-child').style.color = 'var(--text-secondary)';
        });
        btn.style.background = 'var(--surface)'; btn.style.boxShadow = '0 1px 3px rgba(0,0,0,.08)';
        btn.querySelector('span:first-child').style.color = 'var(--accent)';
        btn.querySelector('span:last-child').style.color = 'var(--accent)';
        selCount = parseInt(btn.dataset.count);
      };
    });

    var allTags = ['近5年真题','高频考点','易错题型','时政热点','新题型预测','基础巩固','拔高难题'];
    var selTags = new Set(['高频考点','近5年真题']);
    var tagsDiv = document.getElementById('exam-gen-tags');
    allTags.forEach(function(t) {
      var tb = document.createElement('button');
      tb.textContent = t;
      tb.style.cssText = 'padding:5px 12px;font-size:12px;border:none;border-radius:14px;cursor:pointer;font-family:inherit;background:' + (selTags.has(t)?'var(--accent-soft)':'var(--surface2)') + ';color:' + (selTags.has(t)?'var(--accent)':'var(--text-secondary)');
      tb.onclick = function() {
        if (selTags.has(t)) { selTags.delete(t); tb.style.background='var(--surface2)';tb.style.color='var(--text-secondary)'; }
        else { selTags.add(t); tb.style.background='var(--accent-soft)';tb.style.color='var(--accent)'; }
      };
      tagsDiv.appendChild(tb);
    });
  } else {
    document.getElementById('exam-essay-short').onclick = function() {
      this.classList.add('sel'); this.style.background='var(--surface)'; this.style.boxShadow='0 1px 3px rgba(0,0,0,.08)'; this.style.color='var(--accent)';
      var l = document.getElementById('exam-essay-long');
      l.classList.remove('sel'); l.style.background='var(--surface2)'; l.style.boxShadow='none'; l.style.color='var(--text-secondary)';
    };
    document.getElementById('exam-essay-long').onclick = function() {
      this.classList.add('sel'); this.style.background='var(--surface)'; this.style.boxShadow='0 1px 3px rgba(0,0,0,.08)'; this.style.color='var(--accent)';
      var s = document.getElementById('exam-essay-short');
      s.classList.remove('sel'); s.style.background='var(--surface2)'; s.style.boxShadow='none'; s.style.color='var(--text-secondary)';
    };
  }

  document.getElementById('exam-gen-confirm').onclick = function() {
    var pickedDate = document.getElementById('exam-gen-date').value || date;
    if (isXc) {
      var xcMods = ['资料分析','判断推理','言语理解','数量关系','常识判断'];
      var tagHint = selTags.size ? ' 侧重点：' + [...selTags].join('、') : '';
      var msg = '模拟考试：' + xcMods.join('、') + ' 共' + selCount + '题' + tagHint + '（日期：' + pickedDate + '）。请将试卷保存到 ' + API.mockExamPath('行测', pickedDate) + '，考试ID：' + API.mockExamId('行测', pickedDate);
      document.getElementById('exam-gen-overlay').remove();
      document.querySelector('.exam-card-inner').style.display = 'none';
      document.getElementById('exam-list').style.display = 'none';
      document.getElementById('empty-hint').style.display = 'none';
      document.getElementById('exam-loading').style.display = '';
      API.showLoading(document.getElementById('exam-loading'), 'AI 正在生成行测套卷...');
      API.openAIChat(msg);
    } else {
      var essayType = document.getElementById('exam-essay-short').classList.contains('sel') ? '小题' : '大作文';
      var msg2 = '申论模拟考试（' + essayType + '，日期：' + pickedDate + '）。请将内容保存到 ' + API.mockExamPath('申论', pickedDate) + '，考试ID：' + API.mockExamId('申论', pickedDate);
      document.getElementById('exam-gen-overlay').remove();
      document.querySelector('.exam-card-inner').style.display = 'none';
      document.getElementById('exam-list').style.display = 'none';
      document.getElementById('empty-hint').style.display = 'none';
      document.getElementById('exam-loading').style.display = '';
      API.showLoading(document.getElementById('exam-loading'), 'AI 正在生成申论题目...');
      API.openAIChat(msg2);
    }
  };
}

async function loadHistory() {
  document.getElementById('exam-status').textContent = '加载中...';
  document.getElementById('exam-list').innerHTML = '';
  examFiles = [];
  examStats = { total: 0, scores: [] };

  try {
    const fileObjs = await getExamFiles(subj);
    examFiles = fileObjs;
    examStats.total = fileObjs.length;

    const pname = localStorage.getItem('zhangl-active-project') || '公考练习';
    document.getElementById('exam-status').textContent = pname + ' · 已模考 ' + fileObjs.length + ' 次';

    if (fileObjs.length === 0) {
      document.getElementById('empty-hint').style.display = '';
      return;
    }
    document.getElementById('empty-hint').style.display = 'none';

    var examResults = await Promise.all(fileObjs.slice(0, 30).map(async function(f) {
      var date = f.name.replace('.md','');
      var info = { date: date, score: '', accuracy: '', totalQ: '' };
      try {
        var txt = await API.fetchText(f.path);
        if (txt) {
          var sm = txt.match(/(?:总分?|得分)[：:]\s*(\d+)/);
          var am = txt.match(/正确率[：:]\s*(\d+\.?\d*%)/);
          var qm = txt.match(/共\s*(\d+)\s*题/);
          if (sm) { info.score = sm[1]; examStats.scores.push(parseInt(sm[1])); }
          if (am) info.accuracy = am[1];
          if (qm) info.totalQ = qm[1];
        }
      } catch(e) {}
      return info;
    }));

    var avg = examStats.scores.length > 0
      ? Math.round(examStats.scores.reduce(function(a,b){return a+b;},0)/examStats.scores.length)
      : 0;

    var listHtml = '';
    examResults.forEach(function(info) {
      listHtml +=
        '<div class="history-item" onclick="openExam(\''+info.date+'\')">'+
        '<div class="hi-left"><div class="hi-name">'+subj+'模考 · '+info.date+'</div>'+
        '<div class="hi-time">'+(info.totalQ?info.totalQ+'题  ':'')+info.date+'</div></div>'+
        (info.score
          ? '<div class="hi-score">'+info.score+'分<span>'+(info.accuracy||'')+'</span></div>'
          : '<div class="hi-score" style="font-size:13px;color:var(--text-secondary)">--<span>未批改</span></div>')+
        '<i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--border)"></i></div>';
    });
    document.getElementById('exam-list').innerHTML = listHtml;
  } catch(e) {
    document.getElementById('exam-status').textContent = '加载失败，请刷新重试';
    document.getElementById('empty-hint').style.display = '';
  }
  lucide.createIcons();
}

async function openExam(date) {
  // Push to practice-card in mock exam mode (reuses full interactive quiz UI)
  localStorage.setItem('mp-practice-mode', 'mock');
  localStorage.setItem('mp-practice-date', date);
  localStorage.setItem('mp-target-module', subj);
  API.pushPage('practice-card');
}

function showStats() {
  const overlay = document.createElement('div');
  overlay.className = 'stats-modal-overlay';
  const avg = examStats.scores.length > 0
    ? Math.round(examStats.scores.reduce((a,b)=>a+b,0)/examStats.scores.length)
    : '--';
  const maxScore = examStats.scores.length > 0 ? Math.max(...examStats.scores) : '--';
  overlay.innerHTML = '<div class="stats-modal">'+
    '<h3>模考统计</h3>'+
    '<div class="stats-row">'+
    '<div><div class="stat-val">'+examStats.total+'</div><div class="stat-label">总次数</div></div>'+
    '<div><div class="stat-val">'+avg+'</div><div class="stat-label">均分</div></div>'+
    '<div><div class="stat-val">'+maxScore+'</div><div class="stat-label">最高分</div></div>'+
    '</div>'+
    '<button class="btn-close" onclick="this.closest(\'.stats-modal-overlay\').remove()">关闭</button></div>';
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

// Reload when AI finishes/stops
function onExamAiDone(e) {
  // If AI was manually stopped, don't auto-retry
  if (e.detail && e.detail.stopped) return;
  setTimeout(function() {
    if (!document.getElementById('exam-status')) return;
    document.getElementById('exam-loading').style.display = 'none';
    document.querySelector('.exam-card-inner').style.display = '';
    loadHistory();
  }, 600);
}

// When user manually stops AI, restore exam UI
function onExamAiStopped() {
  var loading = document.getElementById('exam-loading');
  var inner = document.querySelector('.exam-card-inner');
  var list = document.getElementById('exam-list');
  var hint = document.getElementById('empty-hint');
  if (loading) loading.style.display = 'none';
  if (inner) inner.style.display = '';
  if (list) list.style.display = '';
  if (hint) hint.style.display = '';
  loadHistory();
}
document.addEventListener('aic-done', onExamAiDone);
document.addEventListener('aic-stopped', onExamAiStopped);
document.addEventListener('aic-failed', onExamAiStopped);
API.PageRuntime.addCleanup(API.PageRuntime.currentTag, function() {
  document.removeEventListener('aic-done', onExamAiDone);
  document.removeEventListener('aic-stopped', onExamAiStopped);
  document.removeEventListener('aic-failed', onExamAiStopped);
});

// Init
loadHistory();
</script>
</body>
</html>
