<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>公考辅导 - 知识地图</title>
<link rel="stylesheet" href="common.css">
<style>
  .flex-col-gap { display: flex; flex-direction: column; gap: 12px; }
  .graph-container { background: var(--surface); border:1px solid rgba(255,255,255,.035); border-radius: 14px; box-shadow: var(--card-shadow); overflow: hidden; position: relative; min-height:320px; }
  body.light .graph-container { border-color:rgba(0,0,0,.035); }
  .graph-canvas { width: 100%; height: 280px; display:block; touch-action:manipulation; }
  .graph-legend { display: flex; gap: 12px; justify-content: center; padding: 8px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-secondary); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .tab-bar { display: flex; background: var(--surface2); border-radius: 11px; padding: 3px; }
  .tab-btn { flex: 1; text-align: center; padding: 8px 0; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all .15s; }
  .tab-btn.active { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .mod-card { background: var(--surface); border:1px solid rgba(255,255,255,.035); border-radius: 14px; box-shadow: var(--card-shadow); overflow: hidden; }
  body.light .mod-card { border-color:rgba(0,0,0,.035); }
  .mod-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
  .mod-header:active { background: var(--hover); }
  .mod-chevron { transition: transform .2s; flex-shrink: 0; }
  .mod-chevron.open { transform: rotate(90deg); }
  .mod-name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
  .mod-bar { width: 60px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .mod-bar-fill { height: 100%; border-radius: 3px; transition: width .4s; }
  .mod-pct { font-size: 12px; font-weight: 600; width: 32px; text-align: right; flex-shrink: 0; }
  .mod-body { display: none; padding: 0 16px 12px; }
  .mod-body.open { display: block; }

  .kp-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border-light); }
  .kp-row:last-child { border-bottom: none; }
  .kp-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .kp-name { flex: 1; font-size: 13px; color: var(--text); }
  .kp-prog { width: 50px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .kp-prog-fill { height: 100%; border-radius: 3px; }
  .kp-pct { font-size: 11px; font-weight: 600; width: 28px; text-align: right; flex-shrink: 0; color: var(--text-secondary); }

  .kp-detail-overlay { position: fixed; inset: 0; z-index: 10001; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .kp-detail-card { background: var(--surface); border-radius: 16px; width: 100%; max-width: 340px; padding: 20px; box-shadow: 0 12px 48px rgba(0,0,0,.3); }
  .kp-detail-name { font-size: 18px; font-weight: 700; color: var(--text); }
  .kp-detail-module { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .kp-stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 14px 0; }
  .kp-stat { text-align: center; padding: 10px; background: var(--bg); border-radius: var(--radius-md); }
  .kp-stat-val { font-size: 20px; font-weight: 800; }
  .kp-stat-label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
  .kg-hero-title { display:flex; align-items:center; gap:9px; font-size:17px; font-weight:850; color:var(--text); line-height:1.2; }
  .kg-hero-title i { width:20px; height:20px; color:var(--green); }
  .kg-hero-sub { font-size:12px; color:var(--text-secondary); margin-top:5px; text-align:left; line-height:1.45; }
  #kg-hero { text-align:left; }
  #kg-hero .tool-metric-row { justify-content:flex-start; gap:8px; margin-top:12px; }
  #kg-hero .tool-metric { flex:1; min-width:0; background:rgba(255,255,255,.04); border-radius:10px; padding:9px 6px; }
  body.light #kg-hero .tool-metric { background:rgba(0,0,0,.025); }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="navbar tool-navbar">
    <button data-kg-action="back"><i data-lucide="arrow-left"></i></button>
    <span class="title">知识地图</span>
    <button data-task-bell data-kg-action="task" style="position:static"><i data-lucide="bell"></i><span class="task-badge"></span></button>
  </div>

  <div class="hero-card" id="kg-hero">
    <div class="kg-hero-title"><i data-lucide="map"></i><span>知识地图</span></div>
    <div class="kg-hero-sub">按模块、考点和掌握度定位训练优先级</div>
    <div class="tool-metric-row">
      <div class="tool-metric"><span class="value" id="kg-total">0</span><div class="label">考点</div></div>
      <div class="tool-metric"><span class="value" id="kg-weak" style="color:var(--orange)">0</span><div class="label">薄弱</div></div>
      <div class="tool-metric"><span class="value" id="kg-mastered" style="color:var(--green)">0</span><div class="label">掌握</div></div>
    </div>
  </div>

  <div class="tool-actions">
    <button class="btn btn-primary btn-block" data-kg-action="weakest"><i data-lucide="target" style="width:16px;height:16px"></i> 训练最弱考点</button>
    <button class="btn btn-secondary btn-block" data-kg-action="ai-graph"><i data-lucide="sparkles" style="width:16px;height:16px"></i> 画像解读</button>
  </div>

  <!-- View tabs -->
  <div class="tab-bar">
    <div class="tab-btn active" data-kg-action="view" data-view="list">列表视图</div>
    <div class="tab-btn" data-kg-action="view" data-view="graph">图谱视图</div>
  </div>

  <!-- List view (default) -->
  <div id="list-view" class="flex-col-gap">
    <div id="module-list"></div>
  </div>

  <!-- Graph view -->
  <div id="graph-view" style="display:none" class="flex-col-gap">
    <div class="graph-container">
      <canvas class="graph-canvas" id="graph-canvas"></canvas>
      <div class="graph-legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>薄弱(&lt;40%)</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>学习中(40-70%)</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>已掌握(&gt;70%)</div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div id="empty-state" style="display:none">
    <div class="card" style="text-align:center;padding:32px 20px">
      <i data-lucide="compass" style="width:40px;height:40px;color:var(--text-secondary);margin-bottom:12px"></i>
      <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px">尚未建立能力画像</div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.5">完成一些练习后，系统将自动构建你的知识地图</div>
      <button class="btn btn-primary" data-kg-action="practice"><i data-lucide="play" style="width:14px;height:14px"></i> 开始练习</button>
    </div>
  </div>
</div>

<script src="lucide.js"></script>
<script src="common.js"></script>
<script>
API.initPage('knowledge-graph');

var profile = null;
var allKPs = [];
var hasKnowledgeData = false;

(async () => {
  profile = await API.fetchJSON('能力画像.json');
  if (!profile) profile = { modules: {} };

  Object.entries(profile.modules || {}).forEach(function([modName, mod]) {
    Object.entries(mod).forEach(function([kpName, kp]) {
      if (!kp || typeof kp !== 'object' || !('attempts' in kp)) return;
      allKPs.push({
        module: modName, name: kpName,
        proficiency: kp.proficiency || 0,
        total: kp.attempts || 0, correct: kp.correct || 0,
        errorType: (kp.errors && kp.errors.dominant) || '',
        plateau: (kp.plateau && kp.plateau.is_plateau) || false,
        status: kp.status || '未学',
      });
    });
  });

  hasKnowledgeData = allKPs.length > 0;
  if (!hasKnowledgeData) {
    document.getElementById('empty-state').style.display = '';
  }
  renderHeroStats();

  renderListView();
  renderGraphView();
  lucide.createIcons();
})();

function renderHeroStats() {
  var weak = allKPs.filter(function(kp){ return kp.total > 0 && kp.proficiency < 0.6; }).length;
  var mastered = allKPs.filter(function(kp){ return kp.proficiency >= 0.75; }).length;
  document.getElementById('kg-total').textContent = allKPs.length;
  document.getElementById('kg-weak').textContent = weak;
  document.getElementById('kg-mastered').textContent = mastered;
}

function switchView(view) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  if (view === 'list') {
    document.querySelector('.tab-btn:first-child').classList.add('active');
    document.getElementById('list-view').style.display = '';
    document.getElementById('graph-view').style.display = 'none';
  } else {
    document.querySelector('.tab-btn:last-child').classList.add('active');
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('graph-view').style.display = '';
    requestAnimationFrame(function() { renderGraphView(); });
  }
}

// === LIST VIEW ===
function renderListView() {
  var moduleGroups = {};
  allKPs.forEach(function(kp) {
    if (!moduleGroups[kp.module]) moduleGroups[kp.module] = [];
    moduleGroups[kp.module].push(kp);
  });

  var html = '';
  Object.entries(moduleGroups).forEach(function([modName, kps]) {
    var totalQ = kps.reduce(function(s,k){return s+k.total;},0);
    var totalC = kps.reduce(function(s,k){return s+k.correct;},0);
    var pct = totalQ > 0 ? Math.round(totalC/totalQ*100) : 0;
    var color = pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--accent)' : pct >= 30 ? 'var(--orange)' : 'var(--red)';
    var mastered = kps.filter(function(k){return k.proficiency >= 0.7;}).length;

    html += '<div class="mod-card">';
    html += '<div class="mod-header" data-kg-action="toggle-module">';
    html += '<i data-lucide="chevron-right" class="mod-chevron" style="width:16px;height:16px;color:var(--text-secondary)"></i>';
    html += '<div class="mod-name">'+esc(modName)+'</div>';
    html += '<span class="tag" style="background:var(--accent-soft);color:var(--accent)">'+mastered+'/'+kps.length+'</span>';
    html += '<div class="mod-bar"><div class="mod-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>';
    html += '<div class="mod-pct" style="color:'+color+'">'+pct+'%</div>';
    html += '</div>';
    html += '<div class="mod-body">';
    kps.forEach(function(kp) {
      var kpPct = Math.round(kp.proficiency * 100);
      var kpColor = kp.proficiency < 0.40 ? 'var(--red)' : kp.proficiency < 0.70 ? 'var(--orange)' : 'var(--green)';
      var statusLabel = kp.status === '已掌握' ? '已掌握' : kp.total > 0 ? '学习中' : '未学';
      html += '<div class="kp-row" data-kg-action="detail" data-kp="'+API.escapeAttr(JSON.stringify(kp))+'">';
      html += '<div class="kp-status" style="background:'+kpColor+'"></div>';
      html += '<div class="kp-name">'+esc(kp.name)+'</div>';
      if (kp.plateau) html += '<i data-lucide="alert-triangle" style="width:12px;height:12px;color:var(--orange);flex-shrink:0"></i>';
      html += '<div class="kp-prog"><div class="kp-prog-fill" style="width:'+kpPct+'%;background:'+kpColor+'"></div></div>';
      html += '<div class="kp-pct">'+kpPct+'%</div>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  document.getElementById('module-list').innerHTML = html || '<div class="card" style="text-align:center;padding:16px;color:var(--text-secondary);font-size:13px">暂无能力数据</div>';
}

// === GRAPH VIEW ===
function renderGraphView() {
  if (allKPs.length === 0) return;
  var cs = getComputedStyle(document.documentElement);
  var canvas = document.getElementById('graph-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  var container = canvas.parentElement;
  var fallbackW = container ? container.clientWidth : 0;
  var W = Math.max(280, rect.width || fallbackW || window.innerWidth - 32);
  var H = Math.max(260, rect.height || 280);
  canvas.style.height = H + 'px';
  canvas.height = H * dpr;
  canvas.width = W * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  var moduleGroups = {};
  allKPs.forEach(function(kp) { if (!moduleGroups[kp.module]) moduleGroups[kp.module] = []; moduleGroups[kp.module].push(kp); });
  var modNames = Object.keys(moduleGroups);
  var cx = W/2, cy = H/2, R = Math.min(W,H)*0.32;
  var modPos = {};
  modNames.forEach(function(name, i) {
    var a = (2*Math.PI*i/modNames.length) - Math.PI/2;
    modPos[name] = { x: cx+R*Math.cos(a), y: cy+R*Math.sin(a) };
  });

  ctx.strokeStyle = cs.getPropertyValue('--border').trim() || '#333';
  ctx.lineWidth = 1;
  Object.values(modPos).forEach(function(p) { ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(p.x,p.y); ctx.stroke(); });

  ctx.beginPath(); ctx.arc(cx,cy,16,0,2*Math.PI);
  ctx.fillStyle = cs.getPropertyValue('--accent').trim() || '#4A9EFF'; ctx.fill();
  ctx.fillStyle = cs.getPropertyValue('--bg').trim() || '#1A1D23';
  ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('公考', cx, cy);

  var colorVars = ['--purple','--green','--orange','--red','--accent'];
  modNames.forEach(function(name, i) {
    var p = modPos[name];
    var mc = cs.getPropertyValue(colorVars[i % colorVars.length]).trim() || '#7C5CFC';
    ctx.beginPath(); ctx.arc(p.x,p.y,12,0,2*Math.PI); ctx.fillStyle = mc; ctx.fill();
    ctx.fillStyle = cs.getPropertyValue('--text').trim() || '#fff';
    ctx.font = '10px sans-serif'; ctx.fillText(name.substring(0,4), p.x, p.y+22);

    var kps = moduleGroups[name];
    kps.slice(0,8).forEach(function(kp, j) {
      var a = (2*Math.PI*j/Math.min(kps.length,8)) - Math.PI/2;
      var sr = 24 + Math.min(kps.length,8)*3;
      var sx = p.x+sr*Math.cos(a), sy = p.y+sr*Math.sin(a);
      var kc = kp.proficiency < 0.40 ? (cs.getPropertyValue('--red').trim()||'#FF3B30') : kp.proficiency < 0.70 ? (cs.getPropertyValue('--orange').trim()||'#F0A030') : (cs.getPropertyValue('--green').trim()||'#34C759');
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(sx,sy);
      ctx.strokeStyle = cs.getPropertyValue('--border-light').trim() || '#222'; ctx.lineWidth = 0.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(sx,sy, 3+(kp.total>0?3:0), 0, 2*Math.PI); ctx.fillStyle = kc; ctx.fill();
    });
  });

  canvas.onclick = function(e) {
    var r = canvas.getBoundingClientRect();
    var x = e.clientX-r.left, y = e.clientY-r.top;
    var closest = null, dist = Infinity;
    Object.entries(modPos).forEach(function([name,p]) { var d = Math.sqrt((x-p.x)**2+(y-p.y)**2); if (d<30 && d<dist) { closest=name; dist=d; } });
    if (closest && moduleGroups[closest] && moduleGroups[closest].length) {
      showKPDetail(moduleGroups[closest][0]);
    }
  };
}

// === KP DETAIL POPUP ===
function showKPDetail(kp) {
  var existing = document.getElementById('kp-detail-overlay');
  if (existing) existing.remove();
  var color = kp.proficiency < 0.40 ? 'var(--red)' : kp.proficiency < 0.70 ? 'var(--orange)' : 'var(--green)';
  var grade = kp.proficiency >= 0.90 ? 'S' : kp.proficiency >= 0.75 ? 'A' : kp.proficiency >= 0.60 ? 'B' : kp.proficiency >= 0.40 ? 'C' : 'D';
  var statusLabel = kp.status === '已掌握' ? '已掌握' : kp.total > 0 ? '学习中' : '未学';

  var html = '<div class="kp-detail-overlay" id="kp-detail-overlay" data-kg-action="close-overlay">';
  html += '<div class="kp-detail-card">';
  html += '<div style="display:flex;align-items:center;gap:10px">';
  html += '<div class="icon-box '+(kp.proficiency<0.40?'red':kp.proficiency<0.70?'orange':'green')+'"><i data-lucide="target" style="width:20px;height:20px"></i></div>';
  html += '<div style="flex:1"><div class="kp-detail-name">'+esc(kp.name)+'</div><div class="kp-detail-module">'+esc(kp.module)+' · '+statusLabel+(kp.plateau?' · 高原期':'')+'</div></div>';
  html += '<button data-kg-action="close-overlay" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:4px"><i data-lucide="x" style="width:18px;height:18px"></i></button>';
  html += '</div>';
  html += '<div class="kp-stats-grid">';
  html += '<div class="kp-stat"><div class="kp-stat-val" style="color:'+color+'">'+Math.round(kp.proficiency*100)+'%</div><div class="kp-stat-label">熟练度</div></div>';
  html += '<div class="kp-stat"><div class="kp-stat-val">'+kp.total+'</div><div class="kp-stat-label">做题数</div></div>';
  html += '<div class="kp-stat"><div class="kp-stat-val">'+kp.correct+'</div><div class="kp-stat-label">正确数</div></div>';
  html += '</div>';
  if (kp.errorType) {
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">主导错因：<span class="tag '+(kp.errorType.indexOf('概念')>=0?'red':kp.errorType.indexOf('理解')>=0?'orange':'blue')+'">'+esc(kp.errorType.replace('错误',''))+'</span></div>';
  }
  html += '<div style="display:flex;gap:8px">';
  html += '<button class="btn btn-primary" style="flex:1" data-kg-action="drill" data-module="'+API.escapeAttr(kp.module)+'" data-name="'+API.escapeAttr(kp.name)+'"><i data-lucide="zap" style="width:14px;height:14px"></i> 专项练习</button>';
  html += '<button class="btn btn-secondary" style="flex:1" data-kg-action="ai-kp" data-module="'+API.escapeAttr(kp.module)+'" data-name="'+API.escapeAttr(kp.name)+'"><i data-lucide="sparkles" style="width:14px;height:14px"></i> AI讲解</button>';
  html += '</div>';
  html += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  lucide.createIcons();
}

function drillKP(module, kpName) {
  var ov = document.getElementById('kp-detail-overlay'); if (ov) ov.remove();
  localStorage.setItem('mp-target-module', module);
  localStorage.setItem('mp-practice-date', API.getLocalDate());
  localStorage.setItem('mp-practice-mode', 'direct');
  if (kpName) {
    localStorage.setItem('mp-target-kp', kpName);
    localStorage.setItem('mp-focus-kp', kpName);
  } else {
    localStorage.removeItem('mp-target-kp');
    localStorage.removeItem('mp-focus-kp');
  }
  localStorage.setItem('mp-from-tool', 'knowledge-graph');
  API.pushPage('practice-card');
}

function startWeakestKP() {
  if (!allKPs.length) { goPractice(); return; }
  var practiced = allKPs.filter(function(kp) { return kp.total > 0; });
  var pool = practiced.length ? practiced : allKPs;
  var weak = pool.slice().sort(function(a,b) {
    if ((a.proficiency || 0) !== (b.proficiency || 0)) return (a.proficiency || 0) - (b.proficiency || 0);
    return (b.total || 0) - (a.total || 0);
  })[0];
  if (!weak) { goPractice(); return; }
  drillKP(weak.module, weak.name);
}

function askAIAboutKP(module, kpName) {
  var ov = document.getElementById('kp-detail-overlay'); if (ov) ov.remove();
  API.openAIChat('请详细讲解知识点"'+kpName+'"（模块：'+module+'），包括：1) 核心概念 2) 常考题型 3) 解题技巧 4) 易错陷阱。如果我在这个知识点掌握度较低，请给出针对性的学习建议。');
}

function askAIAboutGraph() {
  API.openAIChat('请分析我的知识地图，找出知识盲区和薄弱环节，给出系统性的提分建议。读取能力画像.json 获取详细数据。');
}

function goPractice() {
  localStorage.setItem('mp-practice-date', API.getLocalDate());
  localStorage.setItem('mp-practice-mode', 'smart');
  localStorage.removeItem('mp-target-kp');
  localStorage.removeItem('mp-focus-kp');
  API.pushPage('practice-card');
}

function esc(s) { return API._esc(s); }
var _kgRoot = document.querySelector('.subpage-overlay') || document;
API.PageRuntime.mountController('push:knowledge-graph', _kgRoot, {
  mount: function(root, addCleanup) {
    var onClick = function(e) {
      var t=e.target.closest('[data-kg-action]'); if(!t||!root.contains(t))return;
      var a=t.getAttribute('data-kg-action');
      if(a==='back')API.goBack(); else if(a==='task')API.openTaskPanel();
      else if(a==='weakest')startWeakestKP(); else if(a==='ai-graph')askAIAboutGraph();
      else if(a==='practice')goPractice(); else if(a==='view')switchView(t.getAttribute('data-view'));
      else if(a==='toggle-module') { t.nextElementSibling.classList.toggle('open'); t.querySelector('.mod-chevron').classList.toggle('open'); }
      else if(a==='detail') { try { showKPDetail(JSON.parse(t.getAttribute('data-kp'))); } catch(e) {} }
      else if(a==='drill')drillKP(t.getAttribute('data-module'),t.getAttribute('data-name'));
      else if(a==='ai-kp')askAIAboutKP(t.getAttribute('data-module'),t.getAttribute('data-name'));
      else if(a==='close-overlay' && (t.id==='kp-detail-overlay'||t.closest('button'))) { var o=document.getElementById('kp-detail-overlay'); if(o)o.remove(); }
    };
    document.addEventListener('click',onClick); addCleanup(function(){document.removeEventListener('click',onClick);});
  }
});
</script>
</body>
</html>
