<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self';">
<title>公考辅导</title>
<script>
  document.documentElement.classList.toggle('light', (localStorage.getItem('zhangl-theme') || 'light') !== 'dark');
</script>
<style>
  html, body {
    background: #F5F6FA;
    margin: 0;
    width: 100%;
    min-height: 100%;
  }
</style>
<link rel="stylesheet" href="common.css">
<style>
  .shell-page { display:none; flex-direction:column; flex:1; overflow:hidden; }
  .shell-page.active { display:flex; }
  .shell-page .page-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px 8px; display:flex; flex-direction:column; gap:12px; }
  #sc-wrongbook { gap:6px; }
  #sc-profile { gap:6px; }
  .subpage-overlay { position:fixed; z-index:10000; top:0; bottom:auto; height:var(--app-height); left:100%; right:0;
    background:var(--bg);
    transition:left .25s ease-out;
    display:flex; flex-direction:column; overflow:hidden; }
  .subpage-overlay.in { left:0; }
  .subpage-content { width:100%; height:100%; max-height:100%; padding:0 12px 0; display:flex; flex-direction:column; gap:8px; flex:1; min-height:0; overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior-y:contain; }
  .subpage-content > .navbar { position:-webkit-sticky; position:sticky; top:0; z-index:100; }
</style>
</head>
<body>
<div class="shell-page active" id="sp-home"><div class="page page-scroll" id="sc-home"></div></div>
<div class="shell-page" id="sp-practice"><div class="page page-scroll" id="sc-practice"></div></div>
<div class="shell-page" id="sp-exam"><div class="page page-scroll" id="sc-exam"></div></div>
<div class="shell-page" id="sp-wrongbook"><div class="page page-scroll" id="sc-wrongbook"></div></div>
<div class="shell-page" id="sp-profile"><div class="page page-scroll" id="sc-profile"></div></div>

<div class="tabs"></div>

<script src="lucide.js?_=3"></script>
<script src="common/local-store.js?_=4"></script>
<script src="common/stats.js?_=4"></script>
<script src="common/prompts.js?_=4"></script>
<script src="common/tools.js?_=4"></script>
<script src="common/context-manager.js?_=4"></script>
<script src="common/ai-engine.js?_=4"></script>
<script src="common.js?_=4"></script>
<script>
var startTab = location.hash.replace('#', '') || 'home';
if (['home','practice','exam','wrongbook','profile'].indexOf(startTab) < 0) startTab = 'home';
API.initShell(startTab);
</script>
</body>
</html>
