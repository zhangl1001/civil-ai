<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>公考辅导 - 首页</title>
<link rel="stylesheet" href="common.css">
<style>
  .proj-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; }
  .proj-item.current { color:var(--accent); font-weight:600; background:var(--accent-soft); }

  /* Greeting */
  .greeting { font-size:20px; font-weight:700; color:var(--text); }
  .greeting-sub { font-size:13px; color:var(--text-secondary); margin-top:2px; }

  /* Countdown pill */
  .countdown-card { display:flex; align-items:center; gap:14px; background:linear-gradient(135deg, var(--surface) 0%, var(--accent-soft) 100%); border-radius:14px; padding:16px; box-shadow:var(--card-shadow); border:1px solid var(--accent-soft); }
  body.light .countdown-card { border-color:rgba(26,115,232,.08); }
  .cd-days { font-size:38px; font-weight:800; color:var(--accent); line-height:1; min-width:56px; text-align:center; }
  .cd-label { font-size:10px; color:var(--text-secondary); }
  .cd-right { flex:1; min-width:0; }
  .cd-phase { font-size:12px; font-weight:600; color:var(--accent); margin-bottom:6px; }
  .cd-bar { height:5px; background:var(--border); border-radius:3px; overflow:hidden; margin-bottom:4px; }
  .cd-fill { height:100%; background:var(--accent); border-radius:3px; transition:width .4s; }
  .cd-meta { font-size:11px; color:var(--text-secondary); }

  /* Today plan */
  .today-plan { background:var(--surface); border-radius:14px; padding:14px; box-shadow:var(--card-shadow); display:flex; flex-direction:column; gap:10px; }
  .today-plan-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .today-plan-title { font-size:15px; font-weight:700; color:var(--text); }
  .today-plan-meta { font-size:11px; color:var(--text-secondary); white-space:nowrap; }
  .today-plan-list { display:flex; flex-direction:column; gap:8px; }
  .today-task { display:flex; align-items:center; gap:10px; min-height:44px; padding:9px 10px; border-radius:12px; background:var(--surface2); cursor:pointer; }
  .today-task:active { transform:scale(.99); }
  .today-task-icon { width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--accent-soft); color:var(--accent); }
  .today-task-icon svg { width:16px; height:16px; }
  .today-task-main { flex:1; min-width:0; }
  .today-task-name { font-size:13px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .today-task-sub { font-size:11px; color:var(--text-secondary); margin-top:1px; }
  .today-task-check { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--border); flex-shrink:0; }
  .today-task.done .today-task-name { color:var(--text-secondary); text-decoration:line-through; }
  .today-task.done .today-task-check { border-color:var(--green); background:var(--green); }
  .today-plan-foot { display:flex; gap:8px; }
  .today-plan-foot button { flex:1; height:36px; border:none; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }

  /* Quick actions 2x2 */
  .quick-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }


  /* Module list */
  .mod-list { background:var(--surface); border-radius:14px; padding:4px 0; box-shadow:var(--card-shadow); overflow:hidden; }
  .mod-row { display:flex; align-items:center; gap:10px; padding:10px 16px; cursor:pointer; }
  .mod-row:active { background:var(--hover); }
  .mod-row+.mod-row { border-top:1px solid var(--border-light); }
  .mod-name { font-size:13px; font-weight:500; color:var(--text); width:56px; flex-shrink:0; }
  .mod-bar-wrap { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  .mod-bar-fill { height:100%; border-radius:3px; transition:width .4s; }
  .mod-pct { font-size:12px; font-weight:600; color:var(--text); width:36px; text-align:right; flex-shrink:0; }

  /* Today toast */
  .today-toast { display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:14px; padding:14px; box-shadow:var(--card-shadow); }
  .today-dot { width:10px;height:10px;border-radius:50%;flex-shrink:0; }
  .today-dot.done { background:var(--green); }
  .today-dot.pending { background:var(--orange); }
  .today-text { flex:1; font-size:13px; color:var(--text); }
  .today-text strong { color:var(--accent); }

  /* Empty state — no project */
  .empty-project-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 24px; text-align:center; }
  .empty-project-icon { width:72px;height:72px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:16px; }
  .empty-project-title { font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px; }
  .empty-project-desc { font-size:13px;color:var(--text-secondary);margin-bottom:24px;line-height:1.5; }
  .empty-project-btn { display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 28px;border:none;border-radius:var(--radius-lg);background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .1s; }
  .empty-project-btn:active { transform:scale(.96); }

  /* AI tools grid (3-col) */
  .ai-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .ai-card { display:flex; flex-direction:column; align-items:flex-start; gap:8px; background:var(--surface); border-radius:14px; padding:14px 12px; box-shadow:var(--card-shadow); cursor:pointer; transition:transform .1s, box-shadow .15s; }
  .ai-card:active { transform:scale(.97); box-shadow:var(--card-shadow), 0 0 0 1px var(--accent-soft); }
  .ai-card .quick-icon { width:36px; height:36px; border-radius:10px; }
  .ai-card .quick-label { font-size:13px; }
  .ai-card .quick-sub { font-size:10px; }

  /* Ability center */
  .feature-grid { display:flex; flex-direction:column; gap:10px; }
  .tool-section { background:var(--surface); border:1px solid rgba(255,255,255,.035); border-radius:14px; box-shadow:var(--card-shadow); overflow:hidden; }
  body.light .tool-section { border-color:rgba(0,0,0,.035); }
  .tool-section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:12px 14px 8px; }
  .tool-section-title { font-size:14px; font-weight:800; color:var(--text); line-height:1.25; }
  .tool-section-sub { font-size:11px; color:var(--text-secondary); margin-top:3px; line-height:1.35; }
  .tool-list { display:flex; flex-direction:column; }
  .tool-entry { display:flex; align-items:center; gap:10px; min-height:66px; padding:11px 14px; border-top:1px solid var(--border-light); cursor:pointer; transition:background .15s, transform .1s; }
  .tool-entry:active { background:var(--hover); transform:scale(.99); }
  .tool-entry.disabled { opacity:.58; }
  .tool-entry.disabled:active { transform:none; background:transparent; }
  .feature-icon.icon-box { width:38px; height:38px; border-radius:12px; }
  .feature-main { flex:1; min-width:0; }
  .feature-name { font-size:13px; font-weight:750; color:var(--text); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .feature-sub { margin-top:3px; font-size:11px; color:var(--text-secondary); line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tool-entry-action { display:flex; align-items:center; gap:2px; color:var(--accent); font-size:11px; font-weight:700; flex-shrink:0; }
  .tool-entry-action i { width:14px; height:14px; }

  /* Weak-empty (unified block empty state, ported from study.html) */
  .weak-empty { text-align:center; padding:28px 16px; color:var(--text-secondary); font-size:13px; line-height:1.6; }

  /* Skeleton loading */
  .skeleton { background:var(--surface2); border-radius:4px; animation:sk-shimmer 1.2s ease-in-out infinite; }
  .sk-row { display:flex; align-items:center; gap:10px; padding:10px 16px; }
  .sk-name { width:56px; height:14px; flex-shrink:0; }
  .sk-bar { flex:1; height:6px; border-radius:3px; }
  .sk-pct { width:36px; height:14px; flex-shrink:0; }
  @keyframes sk-shimmer { 0%,100%{opacity:.4} 50%{opacity:.85} }
</style>
</head>
<body>
<div class="page" id="page">
  <!-- Navbar -->
  <div class="navbar" style="justify-content:space-between">
    <div onclick="switchProject()" style="display:flex;align-items:center;gap:5px;min-width:0;cursor:pointer">
      <i data-lucide="graduation-cap" style="color:var(--accent);width:20px;height:20px;flex-shrink:0"></i>
      <span id="project-name" style="font-size:15px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">公考练习</span>
    </div>
    <div class="navbar-actions" style="display:flex;align-items:center;gap:0;flex-shrink:0;margin-right:-10px">
      <button data-task-bell onclick="API.openTaskPanel()" style="position:static"><i data-lucide="bell"></i><span class="task-badge"></span></button>
      <button onclick="API.pushPage('calendar')" title="日历"><i data-lucide="calendar"></i></button>
    </div>
  </div>

  <!-- Greeting -->
  <div class="greeting" id="greeting">加载中...</div>
  <div class="greeting-sub" id="greeting-sub"></div>

  <!-- Empty state — no project -->
  <div id="home-empty-state" class="empty-project-state" style="display:none">
    <div class="empty-project-icon"><i data-lucide="graduation-cap" style="width:36px;height:36px;color:var(--accent)"></i></div>
    <div class="empty-project-title">开始你的备考之旅</div>
    <div class="empty-project-desc">创建备考计划，AI 将为你量身定制学习方案<br>智能刷题 · 申论批改 · 错题巩固</div>
    <button class="empty-project-btn" onclick="API.showNewProject(true)"><i data-lucide="plus" style="width:18px;height:18px"></i> 新建备考计划</button>
  </div>

  <!-- Content area — hidden when no project -->
  <div id="home-content" style="display:flex;flex-direction:column;gap:12px">
  <div class="countdown-card" onclick="API.pushPage('plan')">
    <div style="text-align:center">
      <div class="cd-days" id="cd-days">--</div>
      <div class="cd-label">距考试</div>
    </div>
    <div class="cd-right">
      <div class="cd-phase" id="cd-phase">设置备考计划</div>
      <div class="cd-bar"><div class="cd-fill" id="cd-fill" style="width:0%"></div></div>
      <div class="cd-meta" id="cd-meta"></div>
    </div>
  </div>

  <!-- Today plan -->
  <div class="today-plan" id="today-plan-card">
    <div class="today-plan-head">
      <div class="today-plan-title">今日任务</div>
      <div class="today-plan-meta" id="today-plan-meta">按完成情况调整</div>
    </div>
    <div class="today-plan-list" id="today-plan-list">
      <div class="today-task" onclick="API.pushPage('plan')">
        <div class="today-task-icon"><i data-lucide="calendar-check"></i></div>
        <div class="today-task-main"><div class="today-task-name">生成今日计划</div><div class="today-task-sub">根据能力画像安排今天要做的事</div></div>
        <div class="today-task-check"></div>
      </div>
    </div>
    <div class="today-plan-foot">
      <button style="background:var(--accent);color:#fff" onclick="API.pushPage('plan')">查看计划</button>
      <button style="background:var(--surface2);color:var(--text-secondary)" onclick="API.switchTab('practice')">开始练习</button>
    </div>
  </div>

  <!-- Quick actions -->
  <div class="quick-grid">
    <div class="quick-item" onclick="API.switchTab('practice')">
      <div class="quick-icon practice"><i data-lucide="edit-3" style="width:20px;height:20px"></i></div>
      <div><div class="quick-label">刷题</div><div class="quick-sub">每日练习</div></div>
    </div>
    <div class="quick-item" onclick="localStorage.setItem('es-date',API.getLocalDate());API.pushPage('essay')">
      <div class="quick-icon essay"><i data-lucide="file-text" style="width:20px;height:20px"></i></div>
      <div><div class="quick-label">申论</div><div class="quick-sub">每日一题</div></div>
    </div>
    <div class="quick-item" onclick="API.switchTab('exam')">
      <div class="quick-icon mock"><i data-lucide="monitor" style="width:20px;height:20px"></i></div>
      <div><div class="quick-label">模考</div><div class="quick-sub">模拟考场</div></div>
    </div>
    <div class="quick-item" onclick="API.switchTab('wrongbook')">
      <div class="quick-icon wrong"><i data-lucide="x-circle" style="width:20px;height:20px"></i></div>
      <div><div class="quick-label">错题本</div><div class="quick-sub">查漏补缺</div></div>
    </div>
  </div>

  <!-- Ability center -->
  <div>
    <div class="sec-hdr"><span class="sec-title">能力提升中心</span><span class="sec-action" onclick="API.pushPage('plan')">今日计划</span></div>
    <div class="feature-grid" id="more-tools-grid">
      <div class="tool-section"><div class="tool-entry"><div class="feature-icon icon-box blue"><i data-lucide="loader-2" style="width:20px;height:20px"></i></div><div class="feature-main"><div class="feature-name">加载能力入口</div><div class="feature-sub">正在读取学习数据</div></div></div></div>
    </div>
  </div>

  <!-- Today status -->
  <div class="today-toast" id="today-toast" style="display:none" onclick="API.switchTab('practice')">
    <div class="today-dot" id="today-dot"></div>
    <div class="today-text" id="today-text"></div>
    <i data-lucide="chevron-right" style="width:14px;height:14px;color:var(--border)"></i>
  </div>

  <!-- Review queue -->
  <div class="quick-item" id="review-queue-card" onclick="API.switchTab('wrongbook')" style="margin-bottom:0;display:none">
    <div class="quick-icon wrong"><i data-lucide="rotate-ccw" style="width:20px;height:20px"></i></div>
    <div style="flex:1"><div class="quick-label">待复习</div><div class="quick-sub" id="review-queue-text">加载中...</div></div>
    <i data-lucide="chevron-right" style="width:14px;height:14px;color:var(--border)"></i>
  </div>

  <!-- Module accuracy -->
  <div>
    <div class="sec-hdr">
      <span class="sec-title">能力概览</span>
    </div>
    <div class="mod-list" id="home-mod-list">
      <div class="sk-row"><div class="skeleton sk-name"></div><div class="skeleton sk-bar"></div><div class="skeleton sk-pct"></div></div>
      <div class="sk-row"><div class="skeleton sk-name"></div><div class="skeleton sk-bar"></div><div class="skeleton sk-pct"></div></div>
      <div class="sk-row"><div class="skeleton sk-name"></div><div class="skeleton sk-bar"></div><div class="skeleton sk-pct"></div></div>
    </div>
    <div style="display:flex;gap:12px;padding:6px 4px;font-size:10px;color:var(--text-secondary);justify-content:center">
      <span><span class="kp-dot" style="background:var(--green)"></span> ≥70% 掌握</span><span><span class="kp-dot" style="background:var(--orange)"></span> ≥50% 进行中</span><span><span class="kp-dot" style="background:var(--red)"></span> &lt;50% 薄弱</span>
    </div>
  </div>

  </div><!-- /home-content -->
</div><!-- /page -->

<div class="tabs"></div>

<script src="lucide.js"></script>
<script src="common.js"></script>
<script>
API.initPage('home');

var plan = null, profile = null;

(async () => {
  try {
    // Check if any project exists
    var activeProj = localStorage.getItem('zhangl-active-project');
    var projects = [];
    try { projects = await API.Repository.listProjects(); } catch(e) { API.pageError('home projects', e, '项目列表读取失败'); }
  var hasProject = activeProj || (projects && projects.length > 0);

  if (!hasProject) {
    // No project — show empty state card, hide everything else
    document.getElementById('home-empty-state').style.display = '';
    document.getElementById('home-content').style.display = 'none';
    document.getElementById('greeting').style.display = 'none';
    document.getElementById('greeting-sub').style.display = 'none';
    document.getElementById('project-name').textContent = '公考辅导';
    lucide.createIcons();
    return;
  }

  // Auto-fix: if project list has items but no active selection, pick the first
  if (!activeProj && projects && projects.length) {
    localStorage.setItem('zhangl-active-project', projects[0].name);
    activeProj = projects[0].name;
  }

  // Cache is rendered offline; when a server is configured, refresh it before
  // deriving the home dashboard so an existing backend project is authoritative.
  if (activeProj && API.Repository.isRemoteEnabled()) {
    await API.Repository.sync(activeProj);
  }

  const [stats, p, todayRec] = await Promise.all([
    API.fetchJSON('练习统计.json').catch(()=>null),
    API.fetchJSON('备考计划.json').catch(()=>null),
    API.fetchJSON('每日完成/' + API.getLocalDate() + '.json').catch(()=>null),
  ]);
	  plan = p;
	  try { profile = await API.fetchJSON('能力画像.json'); } catch(e) {}
	  var syllabusTargets = await API.Business.loadSyllabusTargets(profile || {});

  // Review queue
  var reviewDue = await API.getReviewDue();
  if (reviewDue > 0) {
    document.getElementById('review-queue-card').style.display = '';
    document.getElementById('review-queue-text').textContent = reviewDue + ' 题待复习 · 巩固薄弱点';
  }

  // Project name
  if (activeProj) {
    const pname = (plan && plan.exam_name) || activeProj;
    document.getElementById('project-name').textContent = pname;
  }

  // Greeting
  const hour = new Date().getHours();
  const greet = hour < 6 ? '夜深了' : hour < 9 ? '早上好' : hour < 12 ? '上午好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
  document.getElementById('greeting').textContent = greet + '，开始今天的学习吧';

  let sub = '';
  if (profile && profile.modules) {
    let worst = null;
    for (const mod of Object.keys(profile.modules)) {
      const ms = API.moduleStats(profile, mod);
      if (ms.total >= 3 && (!worst || ms.accuracy < worst.accuracy)) worst = { mod, accuracy: ms.accuracy };
    }
    if (worst) sub = '薄弱项：' + worst.mod + ' · 正确率 ' + worst.accuracy + '%，多加练习哦';
  }
  // Streak achievement — count CONSECUTIVE days ending today (not distinct-date count) (audit #3/#4)
  var streakDays = 0;
  if (stats && stats.records) {
    var recDates = new Set(stats.records.map(function(r){return r.date;}));
    var d = new Date();
    while (recDates.has(API.getLocalDate(d)) && streakDays < 1000) { streakDays++; d.setDate(d.getDate()-1); }
  }
  var badge = '';
  if (streakDays >= 100) badge = ' · 传奇考霸';
  else if (streakDays >= 30) badge = ' · 持之以恒';
  else if (streakDays >= 7) badge = ' · 初露锋芒';
  else if (streakDays >= 3) badge = ' · 渐入佳境';
  document.getElementById('greeting-sub').textContent = (sub || '千里之行，始于足下') + (badge ? ' · 连续' + streakDays + '天' + badge : '');

  // Countdown — parse exam_date with explicit local midnight so home and plan pages agree
  if (plan && plan.exam_date) {
    const phases = ['基础期','强化期','冲刺期'];
    let startD = new Date();
    if (plan.phases) for (const pn of phases) { const r = plan.phases[pn]; if (typeof r === 'string') { const m = r.match(/(\d{4}-\d{2}-\d{2})/); if (m) { startD = new Date(m[1]+'T00:00:00'); break; } } }
    const endD = new Date(plan.exam_date+'T00:00:00');
    const td = Math.max(1, Math.ceil((endD - startD) / 86400000));
    const ed = Math.max(0, Math.ceil((new Date() - startD) / 86400000));
    const remain = Math.max(0, td - ed);
    const pct = Math.min(100, Math.round(ed / td * 100));
    document.getElementById('cd-days').textContent = remain;
    document.getElementById('cd-phase').textContent = phases[Math.min(2, Math.floor(ed / Math.max(1, td / 3)))];
    document.getElementById('cd-fill').style.width = pct + '%';
    const examLabel = endD.getFullYear() + '年' + (endD.getMonth()+1) + '月' + endD.getDate() + '日';
    document.getElementById('cd-meta').textContent = '考试：' + examLabel + ' · 进度 ' + pct + '%';
  }

  renderTodayPlan(plan, reviewDue, profile, stats, syllabusTargets);
  renderMoreTools(plan, profile, stats, reviewDue);

  // Today
  const todayOverall = todayRec && todayRec.overall;
  const toast = document.getElementById('today-toast');
  if (todayOverall && todayOverall.score !== undefined) {
    toast.style.display = '';
    document.getElementById('today-dot').className = 'today-dot done';
    document.getElementById('today-text').innerHTML = '<strong>今日已完成</strong> · ' + esc(todayOverall.score) + '分 · ' + esc(todayOverall.grade||'');
  } else if (profile) {
    // Check if today has any practice records
    const todayStr = API.getLocalDate();
    const hasToday = stats && stats.records && stats.records.some(r => r.date === todayStr);
    if (!hasToday) {
      toast.style.display = '';
      document.getElementById('today-dot').className = 'today-dot pending';
      document.getElementById('today-text').innerHTML = '今天还没有练习，<strong>开始刷题吧</strong>';
    }
  }

  // Module accuracy
  if (profile && profile.modules) {
    const mods = Object.keys(profile.modules).map(function(m){ var ms = API.moduleStats(profile, m); return {name:m, total:ms.total, accuracy:ms.accuracy}; }).filter(function(d){ return d.total >= 1; }).sort(function(a,b){ return a.accuracy - b.accuracy; });
    if (mods.length > 0) {
      document.getElementById('home-mod-list').innerHTML = mods.map(function(d) {
        const m = d.name;
        const pct = d.accuracy;
        const color = pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--orange)' : 'var(--red)';
        return '<div class="mod-row" onclick="localStorage.setItem(\'mp-target-module\',\''+esc(m)+'\');localStorage.setItem(\'mp-practice-date\',API.getLocalDate());localStorage.setItem(\'mp-practice-mode\',\'direct\');API.pushPage(\'practice-card\')">'+
          '<span class="mod-name">'+esc(m)+'</span>'+
          '<div class="mod-bar-wrap"><div class="mod-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
          '<span class="mod-pct">'+pct+'%</span>'+
          '<i data-lucide="chevron-right" style="width:14px;height:14px;color:var(--border);flex-shrink:0"></i>'+
        '</div>';
      }).join('');
    } else {
      document.getElementById('home-mod-list').innerHTML = '<div class="weak-empty">完成练习后<br>这里会显示你的能力分布</div>';
    }
  } else {
    document.getElementById('home-mod-list').innerHTML = '<div class="weak-empty">完成练习后<br>这里会显示你的能力分布</div>';
  }

  lucide.createIcons();
  } catch(e) {
    API.pageError('home init', e, '首页数据加载失败');
    var empty = document.getElementById('home-empty-state');
    var content = document.getElementById('home-content');
    if (empty && content) {
      empty.style.display = '';
      content.style.display = 'none';
    }
    var projName = document.getElementById('project-name');
    if (projName) projName.textContent = '公考辅导';
    lucide.createIcons();
  }

})();

function renderTodayPlan(planData, reviewDue, profileData, statsData, syllabusTargets) {
  var list = document.getElementById('today-plan-list');
  var meta = document.getElementById('today-plan-meta');
  if (!list) return;
  var today = API.getLocalDate();
  var items = planData && planData.tasks && planData.tasks[today] && planData.tasks[today].items ? planData.tasks[today].items : [];
  if (!items.length) {
    var built = API.Business.buildTodayTasks({ plan: planData, profile: profileData, stats: statsData, reviewDue: reviewDue, targets: syllabusTargets || [] });
    meta.textContent = built.phase + ' · ' + (built.diagnosis.ready ? '智能调度' : built.diagnosis.label);
    list.innerHTML = built.items.slice(0, 4).map(function(t) { return renderTodayTask(t); }).join('');
    lucide.createIcons();
    return;
  }
  var done = items.filter(function(t) { return t.done; }).length;
  meta.textContent = done + '/' + items.length + ' 已完成' + (planData.tasks[today].phase ? ' · ' + planData.tasks[today].phase : '');
  list.innerHTML = items.slice(0, 4).map(function(t) {
    return renderTodayTask({
	      type: t.type,
	      module: t.module || '',
	      knowledge_point: t.knowledge_point || '',
	      text: t.text || taskName(t.type, t.module),
      sub: taskSub(t),
      done: !!t.done,
    });
  }).join('');
  lucide.createIcons();
}

function renderMoreTools(planData, profileData, statsData, reviewDue) {
  var grid = document.getElementById('more-tools-grid');
  if (!grid) return;
  var records = statsData && statsData.records ? statsData.records : [];
  var totalQ = records.reduce(function(s, r) { return s + (r.total || 0); }, 0);
  var totalWrong = records.reduce(function(s, r) { return s + Math.max(0, (r.total || 0) - (r.correct || 0)); }, 0);
  var hasAbility = !!(profileData && profileData.modules && Object.keys(profileData.modules).length);
  var hasErrors = reviewDue > 0 || totalWrong > 0;
  var days = examDays(planData);
  var sprintReady = hasAbility && days !== null;
  var groups = [
    {
      title: '诊断复盘',
      sub: '把错题、画像和质量数据转成下一组训练',
      items: [
        { name: '错因报告', sub: hasErrors ? (totalWrong + ' 道错题，定位首要错因') : '完成批改后生成', page: 'error-report', icon: 'pie-chart', color: 'red', ready: hasErrors, action: '复盘', reason: '先完成一组练习并批改' },
        { name: '知识地图', sub: hasAbility ? '按大纲查看薄弱考点' : '先建立能力画像', page: 'knowledge-graph', icon: 'map', color: 'green', ready: hasAbility, action: '定位', reason: '先完成诊断或专项练习' },
        { name: '质量追踪', sub: totalQ ? ('已记录 ' + totalQ + ' 题，找训练偏差') : '学习、题目和评分质量面板', page: 'quality-dashboard', icon: 'bar-chart-3', color: 'blue', ready: true, action: '追踪' }
      ]
    },
    {
      title: '专项提升',
      sub: '围绕阶段任务补强薄弱项和素材积累',
      items: [
        { name: '考前冲刺', sub: sprintReady ? (days <= 30 ? ('距考试 ' + days + ' 天，强化冲刺') : ('距考试 ' + days + ' 天，提前规划')) : (days === null ? '设置考试日期后启用' : '先完成诊断练习'), page: 'sprint', icon: 'flame', color: 'orange', ready: sprintReady, action: '冲刺', reason: days === null ? '请先设置备考计划' : '先完成诊断练习' },
        { name: '时政月报', sub: '常识判断与申论素材积累', page: 'monthly-digest', icon: 'newspaper', color: 'blue', ready: true, action: '训练' },
        { name: '面试模拟', sub: '结构化表达与答题复盘', page: 'interview', icon: 'mic', color: 'purple', ready: true, action: '模拟' }
      ]
    }
  ];
  grid.innerHTML = groups.map(function(g) {
    return '<div class="tool-section">' +
      '<div class="tool-section-head"><div><div class="tool-section-title">' + esc(g.title) + '</div><div class="tool-section-sub">' + esc(g.sub) + '</div></div></div>' +
      '<div class="tool-list">' + g.items.map(renderToolEntry).join('') + '</div>' +
    '</div>';
  }).join('');
}

function renderToolEntry(t) {
  var cls = 'tool-entry' + (t.ready ? '' : ' disabled');
  var click = t.ready ? "API.pushPage('" + t.page + "')" : "API.toast('" + API.escapeJs(t.reason || '当前暂不可用') + "')";
  return '<div class="' + cls + '" onclick="' + click + '">' +
    '<div class="feature-icon icon-box ' + t.color + '"><i data-lucide="' + t.icon + '" style="width:20px;height:20px"></i></div>' +
    '<div class="feature-main"><div class="feature-name">' + esc(t.name) + '</div><div class="feature-sub">' + esc(t.sub) + '</div></div>' +
    '<div class="tool-entry-action">' + esc(t.action || '进入') + '<i data-lucide="chevron-right"></i></div>' +
  '</div>';
}

function examDays(planData) {
  if (!planData || !planData.exam_date) return null;
  var exam = new Date(planData.exam_date + 'T00:00:00');
  if (isNaN(exam.getTime())) return null;
  return Math.max(0, Math.ceil((exam - new Date()) / 86400000));
}

function renderTodayTask(t) {
  var icon = taskIcon(t.type);
  var cls = t.done ? ' today-task done' : 'today-task';
  return '<div class="' + cls + '" onclick="goHomeTask(\'' + API.escapeJs(t.type || 'practice') + '\',\'' + API.escapeJs(t.module || '') + '\',\'' + API.escapeJs(t.knowledge_point || '') + '\')">' +
    '<div class="today-task-icon"><i data-lucide="' + icon + '"></i></div>' +
    '<div class="today-task-main"><div class="today-task-name">' + esc(t.text || taskName(t.type, t.module)) + '</div><div class="today-task-sub">' + esc(t.sub || '') + '</div></div>' +
    '<div class="today-task-check"></div>' +
  '</div>';
}

function taskIcon(type) {
  return {diagnosis:'activity', practice:'edit-3', essay:'file-text', review:'rotate-ccw', digest:'book-open', mock:'monitor'}[type] || 'check-circle';
}

function taskName(type, module) {
  if (type === 'diagnosis') return module ? ('诊断测评 · ' + module) : '首次诊断';
  if (type === 'essay') return '申论练习';
  if (type === 'review') return module ? ('错题复习 · ' + module) : '错题复习';
  if (type === 'digest') return '每日积累';
  if (type === 'mock') return '模拟考试';
  return module ? (module + '练习') : '行测练习';
}

function taskSub(t) {
  if (t.sub) return t.sub;
  if (t.reason) return t.reason;
  if (t.done) return '已完成，继续保持节奏';
  if (t.type === 'diagnosis') return '建立画像样本，后续任务才会更准';
  if (t.type === 'practice') return t.module ? ('优先补 ' + t.module) : '完成后更新能力画像';
  if (t.type === 'essay') return 'AI 批改仅作训练参考';
  if (t.type === 'review') return '复盘错因，减少重复失分';
  if (t.type === 'digest') return '补充常识和时政素材';
  if (t.type === 'mock') return '按限时完成，结束后统一批改';
  return '点击进入任务';
}

function goHomeTask(type, module, kp) {
  if (type === 'diagnosis') {
    if (module) localStorage.setItem('mp-target-module', module);
    if (kp) localStorage.setItem('mp-target-kp', kp); else localStorage.removeItem('mp-target-kp');
    localStorage.setItem('mp-practice-date', API.getLocalDate());
    localStorage.setItem('mp-practice-mode', 'smart');
    API.pushPage('practice-card');
  } else if (type === 'essay') {
    localStorage.setItem('es-date', API.getLocalDate());
    API.pushPage('essay');
  } else if (type === 'review') {
    API.switchTab('wrongbook');
  } else if (type === 'digest') {
    API.pushPage('digest');
  } else if (type === 'mock') {
    API.switchTab('exam');
	  } else {
	    if (module) localStorage.setItem('mp-target-module', module);
	    if (kp) localStorage.setItem('mp-target-kp', kp); else localStorage.removeItem('mp-target-kp');
    localStorage.setItem('mp-practice-date', API.getLocalDate());
    localStorage.setItem('mp-practice-mode', module ? 'direct' : 'smart');
    API.pushPage('practice-card');
  }
}

async function switchProject() {
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.id = 'proj-overlay';
  let listHtml = '<div style="text-align:center;padding:16px;color:var(--text-secondary)">加载中...</div>';
  overlay.innerHTML = '<div class="sheet-card" style="max-width:500px;gap:10px" onclick="event.stopPropagation()"><div class="sheet-title">切换工程</div><div id="proj-list" style="max-height:55vh;overflow-y:auto">'+listHtml+'</div><button id="proj-add-btn" style="width:100%;height:40px;border:1.5px dashed var(--border);border-radius:10px;background:transparent;color:var(--text-secondary);font-size:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px"><i data-lucide="plus" style="width:16px;height:16px"></i> 新建工程</button><button style="width:100%;height:40px;border:none;border-radius:10px;background:var(--surface2);color:var(--text-secondary);font-size:14px;cursor:pointer;font-family:inherit" onclick="document.getElementById(\'proj-overlay\').remove()">关闭</button></div>';
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);

  document.getElementById('proj-add-btn').onclick = function() { overlay.remove(); API.showNewProject(); };

  async function refreshList() {
    try {
      const projects = await API.Repository.listProjects();
      const current = localStorage.getItem('zhangl-active-project') || '公考练习';
      listHtml = (projects||[]).map(p => {
        const isCurrent = p.name === current;
        return '<div class="proj-item'+(isCurrent?' current':'')+'" style="padding:10px 12px">'+
          '<button style="flex:1;display:flex;align-items:center;gap:10px;border:none;background:none;font-size:14px;cursor:pointer;font-family:inherit;color:inherit;text-align:left;padding:0" onclick="localStorage.setItem(\'zhangl-active-project\',\''+API.escapeJs(p.name)+'\');location.reload()">'+
            (isCurrent ? '<i data-lucide="check" style="width:16px;height:16px;color:var(--accent);flex-shrink:0"></i>' : '<i data-lucide="circle" style="width:16px;height:16px;color:var(--border);flex-shrink:0"></i>')+
            esc(p.name)+
          '</button>'+
          '<button style="border:none;background:none;cursor:pointer;color:var(--text-secondary);padding:2px;flex-shrink:0;display:flex;align-items:center;opacity:.6" title="删除工程" onclick="event.stopPropagation();deleteProject(\''+API.escapeJs(p.name)+'\')"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>'+
        '</div>';
      }).join('');
    } catch(e) {
      API.pageError('home project list', e, '工程列表加载失败');
      listHtml = '<div style="text-align:center;padding:16px;color:var(--text-secondary)">工程列表加载失败</div>';
    }
    document.getElementById('proj-list').innerHTML = listHtml || '<div style="text-align:center;padding:16px;color:var(--text-secondary)">暂无工程</div>';
    lucide.createIcons();
  }

  window.deleteProject = function(name) {
    API.confirmDanger('删除工程', '将永久删除工程「' + name + '」及其所有本地文件。此操作不可恢复。', name, async function() {
      try {
        await API.Repository.deleteProject(name);
        const current = localStorage.getItem('zhangl-active-project');
        if (current === name) {
          const projects2 = await API.Repository.listProjects();
          const other = (projects2||[]).find(p => p.name !== name);
          if (other) {
            localStorage.setItem('zhangl-active-project', other.name);
          } else {
            localStorage.removeItem('zhangl-active-project');
          }
        }
        // Remove overlay, then reload the home tab (not the entire page — keeps other tabs intact)
        var overlay = document.getElementById('proj-overlay');
        if (overlay) overlay.remove();
        // Force re-render home tab content
        if (typeof API !== 'undefined' && API._loadTabRoot) {
          API._tabLoaded['home'] = false;  // Clear cache so it reloads fresh
          API._loadTabRoot('home');
        } else {
          location.reload();  // Fallback for non-shell mode
        }
      } catch(e) { API.pageError('deleteProject', e, '删除工程失败'); }
    });
  };

  refreshList();
}

function esc(s) { return API._esc(s); }
</script>
