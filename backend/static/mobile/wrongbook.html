<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>公考辅导 - 错题本</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Filter bar below navbar */
  .wb-filters { display:flex; gap:6px; overflow-x:auto; flex-shrink:0; }
  .wb-chip { display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border-radius:16px;
    border:1px solid var(--border); background:var(--surface); font-size:12px; color:var(--text-secondary);

  .wb-chip:active { background:var(--hover); }
  .wb-chip.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .wb-chip.has-subtype { border-color:var(--accent); color:var(--accent); }

  .wb-stats { display:flex; background:var(--surface); border-radius:14px; box-shadow:var(--card-shadow); overflow:hidden; }
  .wb-stats .stat { flex:1; text-align:center; padding:10px 6px; }
  .wb-stats .stat+.stat { border-left:1px solid var(--border-light); }
  .wb-stats .stat-val { font-size:15px; font-weight:600; color:var(--text); }
  .wb-stats .stat-label { font-size:10px; color:var(--text-secondary); margin-top:2px; }

  /* Module group header */
  .wb-mod-hdr { padding:10px 4px 4px; font-size:12px; font-weight:600; color:var(--accent);
    display:flex; align-items:center; gap:6px; }
  .wb-mod-hdr .count { font-size:11px; font-weight:400; color:var(--text-secondary); }

  /* Wrong item row */
  .wb-row { display:flex; align-items:flex-start; gap:10px; padding:12px;
    border-bottom:1px solid var(--border-light); cursor:pointer; transition:background .1s; }
  .wb-row:active { background:var(--hover); }
  .wb-row:last-child { border-bottom:none; }
  .wb-check { width:20px;height:20px; border:2px solid var(--border); border-radius:6px;
    flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .wb-check.sel { background:var(--accent); border-color:var(--accent); }
  .wb-check.sel::after { content:''; width:5px;height:9px; border:2px solid #fff; border-top:none; border-left:none; transform:rotate(45deg) translateY(-1px); }
  .wb-body { flex:1; min-width:0; }
  .wb-top { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .wb-qnum { font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft);
    padding:1px 6px; border-radius:4px; flex-shrink:0; }
  .wb-subtype { font-size:10px; color:var(--text-secondary); background:var(--surface2);
    padding:1px 6px; border-radius:4px; flex-shrink:0; }
  .wb-priority { font-size:10px; background:rgba(255,149,0,.14); color:var(--orange);
    padding:1px 6px; border-radius:4px; flex-shrink:0; }
  .wb-priority.low { background:var(--surface2); color:var(--text-secondary); }
  .wb-priority.high { background:rgba(255,69,58,.12); color:var(--red); }
  .wb-date { font-size:10px; color:var(--text-secondary); margin-left:auto; flex-shrink:0; }
  .wb-stem { font-size:13px; color:var(--text); line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .wb-expand { color:var(--text-secondary); font-size:10px; margin-left:4px; flex-shrink:0; transition:transform .2s; }
  .wb-expand.open { transform:rotate(90deg); }

  /* Detail panel (inline, below row) */
  .wb-detail { display:none; padding:0 12px 14px 42px; border-bottom:1px solid var(--border-light); }
  .wb-detail.open { display:block; }
  .wb-detail .md-content { font-size:13px; line-height:1.75; }
  .wb-detail .correct-badge { display:inline-block; padding:2px 10px; border-radius:var(--radius-full);
    background:rgba(52,199,89,.12); color:var(--green); font-size:12px; font-weight:600; margin-right:8px; }
  .wb-detail .wrong-badge { display:inline-block; padding:2px 10px; border-radius:var(--radius-full);
    background:rgba(255,69,58,.12); color:var(--red); font-size:12px; font-weight:600;
    text-decoration:line-through; margin-right:8px; }
  .wb-detail .section-label { font-size:11px; font-weight:600; color:var(--accent); margin-top:10px; margin-bottom:4px;
    display:flex; align-items:center; gap:4px; }
  .wb-detail .section-label::before { content:''; width:3px; height:12px; border-radius:2px; background:var(--accent); }

  /* List card wrapper */
  .wb-list-card { background:var(--surface); border-radius:14px; box-shadow:var(--card-shadow); overflow:hidden; }

  /* Bottom action bar */
  .wb-actions { display:flex; gap:8px; flex-shrink:0; padding:4px 0; }
  .wb-actions button { flex:1; height:40px; border:none; border-radius:10px; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:5px; }
  .wb-actions button:disabled { opacity:.4; pointer-events:none; }
  .btn-redo { background:var(--accent); color:#fff; }
  .btn-flash { background:var(--surface); color:var(--text); border:none!important; }
  .btn-del { background:var(--surface2); color:var(--text-secondary); }

  /* Flashcard overlay */
  .fc-overlay { position:fixed; inset:0; z-index:10001; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .fc-dialog { background:var(--surface); border-radius:16px; width:100%; max-width:420px;
    height:66vh; display:flex; flex-direction:column; box-shadow:0 16px 48px rgba(0,0,0,.35);
    overflow:hidden; animation:fcPopIn .25s ease-out; }
  @keyframes fcPopIn { from { opacity:0; transform:scale(.92) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
  .fc-dialog-header { display:flex; align-items:center; padding:10px 14px; gap:8px;
    border-bottom:1px solid var(--border-light); flex-shrink:0; }
  .fc-dialog-header .fc-title { flex:1; font-size:14px; font-weight:600; }
  .fc-dialog-header button { background:none; border:none; cursor:pointer; color:var(--text-secondary); padding:4px; display:flex; align-items:center; border-radius:50%; }
  .fc-dialog-header button:active { background:var(--hover); }

  /* Card area: the scrollable middle zone between header and footer */
  .fc-card-area { flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 12px 4px; min-height:0; }
  .fc-card { width:100%; flex:1; cursor:pointer; perspective:1000px; min-height:0; }
  .fc-card-inner { position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d; }
  .fc-card.flipped .fc-card-inner { transform:rotateY(180deg); }
  .fc-front, .fc-back { border-radius:14px; padding:18px 16px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    border:1px solid var(--border-light); backface-visibility:hidden; -webkit-backface-visibility:hidden;
    height:100%; position:absolute; top:0; left:0; right:0; bottom:0; }
  .fc-front { background:var(--bg); }
  .fc-back { background:var(--bg); transform:rotateY(180deg); }
  .fc-module-tag { font-size:11px; color:var(--accent); font-weight:600; margin-bottom:10px; }
  .fc-question { font-size:15px; line-height:1.7; color:var(--text); }
  .fc-hint { font-size:11px; color:var(--text-secondary); text-align:center; padding:2px 0; flex-shrink:0; }
  /* Back side sections */
  .fc-ans-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .fc-ans-correct { display:inline-flex; align-items:center; gap:4px; padding:4px 14px; border-radius:20px; background:rgba(52,199,89,.12); color:var(--green); font-size:14px; font-weight:700; }
  .fc-ans-wrong { display:inline-flex; align-items:center; gap:4px; padding:4px 14px; border-radius:20px; background:rgba(255,69,58,.12); color:var(--red); font-size:12px; text-decoration:line-through; }
  .fc-section { margin-top:14px; }
  .fc-section-title { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; margin-bottom:6px; }
  .fc-section-title::before { content:''; width:3px; height:14px; border-radius:2px; flex-shrink:0; }
  .fc-section-title.err::before { background:var(--red); }
  .fc-section-title.err { color:var(--red); }
  .fc-section-title.fix::before { background:var(--green); }
  .fc-section-title.fix { color:var(--green); }
  .fc-section-title.tip::before { background:var(--accent); }
  .fc-section-title.tip { color:var(--accent); }
  .fc-section-body { font-size:13px; line-height:1.8; color:var(--text); }
  .fc-section-body p { margin:0 0 4px; }
  .fc-section-body p:last-child { margin-bottom:0; }
  .fc-section-body strong { color:var(--text); }

  /* Dialog footer */
  .fc-dialog-footer { padding:10px 14px 14px; display:flex; gap:10px; flex-shrink:0; }
  .fc-dialog-footer button { flex:1; height:42px; border:none; border-radius:21px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .fc-again { background:var(--surface2); color:var(--red); }
  .fc-gotit { background:var(--green); color:#fff; }
  .fc-again:active { background:rgba(255,59,48,.15); }
  .fc-gotit:active { background:rgba(52,199,89,.85); }

  /* Nav buttons inside card area */
  .fc-nav-row { display:flex; justify-content:space-between; align-items:center; padding:8px 2px 0; flex-shrink:0; }
  .fc-nav-row button { background:none; border:none; color:var(--text-secondary); font-size:12px; cursor:pointer; font-family:inherit; padding:4px 8px; }
  .fc-nav-row .fc-counter { font-size:12px; color:var(--text-secondary); }

  /* Sheet overlay (filter) */
  .sheet-mask { position:fixed; inset:0; z-index:10001; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .25s; }
  .sheet-mask.open { opacity:1; pointer-events:auto; }
  .sheet-panel { position:fixed; z-index:10002; left:0; right:0; bottom:0; background:var(--surface);
    border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom));

  .sheet-panel.open { transform:translateY(0); }
  .sheet-handle { width:36px;height:4px;border-radius:2px;background:var(--border); margin:0 auto 16px; }
  .sheet-panel h3 { font-size:17px; margin-bottom:14px; }
  .sheet-panel label { display:block; font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
  .sheet-panel select { width:100%; height:42px; padding:0 10px; border:1px solid var(--border); border-radius:10px;
    font-size:15px; color:var(--text); font-family:inherit; background:var(--bg); margin-bottom:14px; }
  .sheet-btns { display:flex; gap:8px; margin-top:4px; }
  .sheet-btns button { flex:1; height:44px; border:none; border-radius:var(--radius-lg); font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .sheet-cancel { background:var(--bg); color:var(--text-secondary); }
  .sheet-confirm { background:var(--accent); color:#fff; }

  /* Empty state */
  .empty-wb { display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:12px; padding:64px 32px; flex:1; }
  .empty-wb .empty-icon { width:72px;height:72px;border-radius:50%;background:var(--surface2);
    display:flex;align-items:center;justify-content:center; }
  .empty-wb h3 { font-size:17px; font-weight:600; color:var(--text); }
  .empty-wb p { font-size:13px; color:var(--text-secondary); line-height:1.6; max-width:240px; }
  .empty-wb button { height:40px; padding:0 28px; border:none; border-radius:20px; background:var(--accent);
    color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:6px; }

  /* Confirm dialog */
  .confirm-mask { position:fixed; inset:0; z-index:10003; background:rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; }
  .confirm-box { background:var(--surface); border-radius:14px; padding:24px; width:85%; max-width:320px; }
  .confirm-box h3 { font-size:17px; margin-bottom:10px; }
  .confirm-box p { font-size:13px; color:var(--text-secondary); line-height:1.6; margin-bottom:18px; }
  .confirm-btns { display:flex; gap:8px; }
  .confirm-btns button { flex:1; height:42px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .confirm-cancel { background:var(--bg); color:var(--text-secondary); }
  .confirm-danger { background:var(--red); color:#fff; }

  /* Loading skeleton */
  .wb-skeleton { padding:12px; }
  .wb-sk-row { display:flex; gap:10px; padding:10px 0; align-items:center; }
  .wb-sk-avatar { width:20px;height:20px;border-radius:6px;background:var(--surface2);flex-shrink:0; }
  .wb-sk-lines { flex:1; display:flex; flex-direction:column; gap:6px; }
  .wb-sk-line { height:10px; border-radius:4px; background:var(--surface2); }
  .wb-sk-line.w60 { width:60%; } .wb-sk-line.w80 { width:80%; } .wb-sk-line.w40 { width:40%; }
</style>

<body>
<div class="page" id="page">
  <!-- Navbar -->
  <div class="navbar" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:6px">
      <i data-lucide="book-open" style="color:var(--accent);width:20px;height:20px"></i>
      <span style="font-size:15px;font-weight:600;color:var(--text)">错题本</span>
    </div>
    <div class="navbar-actions" style="display:flex;align-items:center;gap:0">
      <button data-task-bell data-wb-action="tasks" style="position:static;background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:4px;display:flex;align-items:center" title="消息"><i data-lucide="bell" style="width:18px;height:18px"></i><span class="task-badge"></span></button>
      <button data-wb-action="filter" style="background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:4px;display:flex;align-items:center" title="筛选"><i data-lucide="filter" style="width:18px;height:18px"></i></button>
      <button data-wb-action="flashcard" style="background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:4px;display:flex;align-items:center" title="闪卡"><i data-lucide="layers" style="width:18px;height:18px"></i></button>
      <span style="position:relative">
        <button data-wb-action="menu" style="background:none;border:none;cursor:pointer;color:var(--text);padding:4px;display:flex;align-items:center;border-radius:50%"><i data-lucide="more-vertical" style="width:18px;height:18px"></i></button>

    </label>

  <!-- Stats -->

<script>
API.initPage('wrongbook');

// ===== State =====
var allItems = [], selItems = new Set(), selAll = false;
var filterMod = '', filterTime = 'due', filterSubType = '';
var XC_MODULES = API.XC_MODULES.concat(['申论']);
var _expandedId = null;
var _fcSM2 = { items: {} };  // SM-2 spaced repetition state
var _reviewQueue = { queue: [], queue_v2: [] };
var WB_PAGE_SIZE = 80;
var wbVisibleCount = WB_PAGE_SIZE;
var wbFilteredItems = [];

// ===== Load =====
function loadWrongBook() {
  allItems = []; selItems.clear(); selAll = false;
  var list = document.getElementById('wrong-list');
  if (!list) { console.error('[wrongbook] #wrong-list not found in DOM'); return; }
  list.innerHTML = '<div class="wb-skeleton">'+
    [1,2,3,4,5].map(function(){return '<div class="wb-sk-row"><div class="wb-sk-avatar"></div><div class="wb-sk-lines"><div class="wb-sk-line w80"></div><div class="wb-sk-line w40"></div></div></div>';}).join('')+
    '</div>';
  loadFromServer();
}

async function loadFromServer() {
  allItems = [];
  try {
  if (API.Index && API.Index.wrongBookItems) {
    try {
      var indexedItems = await API.Index.wrongBookItems();
      if (indexedItems && indexedItems.length) allItems = indexedItems;
    } catch(e) { console.warn('[wrongbook index]', e); }
  }

  if (allItems.length === 0) {
  // 1. Fetch all module wrongbook files in parallel
  var results = await Promise.all(XC_MODULES.map(async function(mod) {
    try {
      var text = await API.fetchText('错题本/' + mod + '.md');
      if (!text || !text.trim() || text.includes('*暂无错题记录*')) return [];
      return parseModuleFile(text, mod);
    } catch(e) { return []; }
  }));
  results.forEach(function(items) { allItems = allItems.concat(items); });
  }

  // 2. Fallback: list 错题本/ directory
  if (allItems.length === 0) {
    try {
      var paths = await API.listFiles('错题本/');
      var files = paths.filter(function(p) { return p.endsWith('.md'); }).map(function(p) { return {name: p.split('/').pop()}; });
      files.sort(function(a,b) { return (b.name||'').localeCompare(a.name||''); });
        var fileResults = await Promise.all(files.slice(0, 50).map(async function(f) {
          var txt = await API.fetchText('错题本/' + f.name);
          if (!txt || !txt.trim()) return [];
          var modGuess = XC_MODULES.find(function(m) { return f.name.indexOf(m) >= 0; }) || '';
          var parsed2 = parseModuleFile(txt, modGuess || '错题回顾');
          if (parsed2.length === 0) parsed2 = parseFlatFile(txt, f.name.replace('.md',''), modGuess || '未知模块');
          return parsed2;
        }));
        fileResults.forEach(function(items) { allItems = allItems.concat(items); });
    } catch(e) { console.warn('[loadFromServer] step2 error:', e); }
  }

  // 3. Last resort: parse 练习统计.json for wrong counts
  if (allItems.length === 0) {
    try {
      var stats = await API.fetchJSON('练习统计.json');
      if (stats && stats.records) {
        stats.records.forEach(function(rec) {
          // records are flat: {module, total, correct, ...} — no `modules` sub-object
          if ((rec.correct||0) < (rec.total||0)) {
            allItems.push({
              id: 'ws'+allItems.length, qNum: '', module: rec.module || '',
              subType: '', date: rec.date,
              stem: (rec.module||'') + ' · ' + rec.date + ' (' + (rec.correct||0) + '/' + (rec.total||0) + ')',
              correctAns: '', wrongAns: '', reason: '', analysis: '', fix: '',
              fullText: ''
            });
          }
        });
      }
    } catch(e) { console.warn('[loadFromServer] step3 error:', e); }
  }

	  // Load SM-2 data
	  await loadFcSM2();
	  await loadReviewQueueV2();
	  allItems.forEach(function(item) {
	    item.reviewPriority = API.Business.reviewPriority(item, _fcSM2, _reviewQueue);
	  });

  } catch(e) { console.error('[loadFromServer] fatal:', e); }
  applyFilter();
}

// Parse per-module wrongbook file using DEFINED structure.
// Every field starts with a fixed **marker：** — no fuzzy matching.
//
// Entry structure:
//   ### Q\d+ | subType | date
//
//   **原题：**
//   {question text with options}
//   @see {file_path} Q\d+
//
//   **你的答案：** {answer}
//   **正确答案：** {answer}
//   **错因：**
//   {error analysis}
//   **正解：**
//   {correct approach}
//   **技巧：**
//   {tips}
//
function parseModuleFile(text, moduleName) {
  var items = [];

  // Split by DEFINED header: ### Q\d+
  var sections = text.split(/\n(?=###\s+Q\d+)/);
  for (var si = 0; si < sections.length; si++) {
    var sec = sections[si];
    var h = sec.match(/^###\s+(Q\d+)\s*[|｜]\s*(.+?)\s*[|｜]\s*(\d{4}-\d{2}-\d{2})/m);
    if (!h) continue;
    var qNum = h[1], subType = h[2].trim(), date = h[3];
    var body = sec.slice(h[0].length);

    // ── Extract each field by its DEFINED marker ──

    // @see reference — always on its own line
    var seeRef = null;
    var seeMatch = body.match(/@see\s+(\S+\.md)\s*(Q\d+)?/);
    if (seeMatch) seeRef = { file: seeMatch[1], qNum: seeMatch[2] || '' };

    // **原题：** — question text (from marker to @see line)
    var origText = '';
    var origMatch = body.match(/\*\*原题[：:]\*\*\s*([\s\S]*?)(?=\n@see|\n\*\*你的答案|\n\*\*正确答案|$)/);
    if (origMatch) {
      origText = origMatch[1].trim();
    }

    // **你的答案：** — single line
    var yourAns = '';
    var yourMatch = body.match(/\*\*你的答案[：:]\*\*\s*(.+?)(?:\n|$)/);
    if (yourMatch) yourAns = yourMatch[1].trim();

    // **正确答案：** — single line
    var correctAns = '';
    var correctMatch = body.match(/\*\*正确答案[：:]\*\*\s*(.+?)(?:\n|$)/);
    if (correctMatch) correctAns = correctMatch[1].trim();

    // **错因：** — multi-line until next **marker or end
    var reason = '';
    var reasonMatch = body.match(/\*\*错因[：:]\*\*\s*([\s\S]*?)(?=\n\*\*正解|\n\*\*技巧|$)/);
    if (reasonMatch) reason = reasonMatch[1].trim();

    // **正解：** — multi-line until next **marker or end
    var fix = '';
    var fixMatch = body.match(/\*\*正解[：:]\*\*\s*([\s\S]*?)(?=\n\*\*技巧|$)/);
    if (fixMatch) fix = fixMatch[1].trim();

    // **技巧：** — multi-line to end
    var tips = '';
    var tipsMatch = body.match(/\*\*技巧[：:]\*\*\s*([\s\S]*?)$/);
    if (tipsMatch) tips = tipsMatch[1].trim();

    // ── Legacy fallback: dash format (- 你的答案：X | 正确答案：Y) ──
    if (!correctAns) {
      var dashMatch = body.match(/[-–—]\s*你的答案[：:]\s*(.+?)\s*\|\s*正确答案[：:]\s*(.+?)(?:\n|$)/);
      if (dashMatch) { yourAns = yourAns || dashMatch[1].trim(); correctAns = dashMatch[2].trim(); }
    }
    if (!reason) {
      var dashReason = body.match(/[-–—]\s*错因[：:]\s*([\s\S]*?)(?=\n[-–—]\s*正解|\n[-–—]\s*技巧|$)/);
      if (dashReason) reason = dashReason[1].trim();
    }
    if (!fix) {
      var dashFix = body.match(/[-–—]\s*正解[：:]\s*([\s\S]*?)(?=\n[-–—]\s*技巧|$)/);
      if (dashFix) fix = dashFix[1].trim();
    }
    if (!tips) {
      var dashTips = body.match(/[-–—]\s*技巧[：:]\s*([\s\S]*?)$/);
      if (dashTips) tips = dashTips[1].trim();
    }

    // ── Build item ──

    // Summary: show actual question text, not "查看原题 →"
    // Strip the **N.** marker prefix and difficulty tag for clean display
    var cleanText = origText.replace(/^\*\*\d+\.\*\*\s*(?:（[^）]*）\s*)?/, '').trim();
    var summary;
    if (cleanText.length > 5) {
      summary = cleanText.substring(0, 80);
    } else if (seeRef) {
      summary = '📄 查看原题 →';
    } else {
      summary = origText.substring(0, 80) || '(无题目文本)';
    }

    // Stem for detail/flashcard display: full question text (without @see line)
    var stem = origText;

    // Extract answer letters for badges
    var ansLetter = correctAns.match(/^[A-D]/);
    var wrongLetter = yourAns.match(/^[A-D]/);

    items.push({
      id: 'w'+items.length+'_'+moduleName.replace(/[^a-zA-Z0-9一-鿿]/g,''),
      qNum: qNum, module: moduleName, subType: subType, date: date,
      stem: stem, summary: summary,
      correctAns: ansLetter ? ansLetter[0] : correctAns,
      wrongAns: wrongLetter ? wrongLetter[0] : yourAns,
      reason: reason, analysis: fix, fix: fix, tips: tips,
      fullText: body, seeRef: seeRef,
      rawBlock: sec.trim()  // 保存原始 markdown 块，用于删除持久化
    });
  }
  return items;
}

// Parse flat/HR-split files (fallback for old format)
function parseFlatFile(text, date, mod) {
  var items = [];
  var div = document.createElement('div'); div.innerHTML = text;
  var hrs = div.querySelectorAll('hr');
  var preParts = [], pn = hrs.length ? hrs[0].previousElementSibling : div.firstElementChild;
  while (pn && pn.tagName !== 'HR') { if (pn.textContent.trim()) preParts.unshift(pn); pn = pn.previousElementSibling; }
  var segs = preParts.length ? [{parts:preParts}] : [];
  for (var i = 0; i < hrs.length; i++) {
    var parts = [], node = hrs[i].nextElementSibling;
    while (node && node.tagName !== 'HR') { if (node.textContent.trim()) parts.push(node); node = node.nextElementSibling; }
    segs.push({parts:parts});
  }
  var qNum = 0;
  segs.forEach(function(seg) {
    if (!seg.parts.length) return; qNum++;
    var frag = document.createElement('div'); seg.parts.forEach(function(p) { frag.appendChild(p.cloneNode(true)); });
    var stemEl = frag.querySelector('p,h3,h4');
    var stem = stemEl ? stemEl.textContent.trim().replace(/^\*\*\d+\.\*\*\s*/,'').replace(/^\d+\.\s*/,'') : '';
    var wrongAns='', correctAns='';
    var ab = frag.querySelector('.answer-block');
    if (ab) { var cm = ab.textContent.match(/(?:答案|正确答案)[：:\s]*([A-D])/); if (cm) correctAns=cm[1]; }
    var we = frag.querySelector('.wrong,.q-opt.wrong');
    if (we) { var wm = we.textContent.trim().match(/^([A-D])/); if (wm) wrongAns=wm[1]; }
    if (stem) items.push({
      id: 'wf'+items.length+'_'+mod.replace(/[^a-zA-Z0-9一-鿿]/g,''),
      qNum: 'Q'+qNum, module: mod, subType: '', date: date,
      stem: stem, correctAns: correctAns, wrongAns: wrongAns,
      reason: '', analysis: '', fix: '',
      fullText: seg.parts.map(function(p){return p.outerHTML||p.textContent;}).join('\n')
    });
  });
  return items;
}

// ===== Apply Filters =====
function applyFilter() {
  var today = API.getLocalDate();
  var filtered = allItems.filter(function(item) {
    if (filterMod && item.module !== filterMod) return false;
    if (filterSubType && item.subType !== filterSubType) return false;
    if (filterTime === 'due' && (!item.reviewPriority || item.reviewPriority.level !== 'high')) return false;
    if (filterTime === 'today' && item.date !== today) return false;
    if (filterTime === '7d') {
      var d = new Date(item.date), w = new Date(); w.setDate(w.getDate()-7);
      if (isNaN(d.getTime())) return true;
      if (d < w) return false;
    }
    if (filterTime === '30d') {
      var d = new Date(item.date), m = new Date(); m.setDate(m.getDate()-30);
      if (isNaN(d.getTime())) return true;
      if (d < m) return false;
    }
    return true;
  });

  wbFilteredItems = filtered;
  wbVisibleCount = WB_PAGE_SIZE;
  renderList(filtered);
  updateStats(filtered);
  updateFilterChips();
}

    var ed = document.getElementById('wb-empty-desc'); if (ed) ed.textContent = '完成练习并批改后，错题会自动收录到错题本';

    return;
  }

  listEl.style.display = ''; emptyEl.style.display = 'none';

  if (items.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:40px 16px;color:var(--text-secondary)"><i data-lucide="search" style="width:36px;height:36px;color:var(--border);margin-bottom:12px"></i><div style="font-size:15px;font-weight:600;margin-bottom:4px">无匹配错题</div><div style="font-size:12px">试试调整筛选条件</div></div>';

  }

  var visibleItems = items.slice(0, wbVisibleCount);

  var groups = {};
  visibleItems.forEach(function(item) {
    if (!groups[item.module]) groups[item.module] = [];
    groups[item.module].push(item);
  });

  var html = '';
  var modNames = Object.keys(groups);
  // Keep original module order
  modNames.sort(function(a,b) {
    var ai = XC_MODULES.indexOf(a), bi = XC_MODULES.indexOf(b);
    if (ai >= 0 && bi >= 0) return ai - bi;

    return a.localeCompare(b);
  });

  modNames.forEach(function(mod) {
    var gItems = groups[mod];
    html += '<div class="wb-mod-hdr">'+escH(mod)+' <span class="count">'+gItems.length+'题</span></div>';
    html += '<div class="wb-list-card">';

      var sel = selItems.has(item.id);

      html += '<div id="wi-'+escH(item.id)+'">'+
        '<div class="wb-row" data-wb-action="detail" data-wb-id="'+escH(item.id)+'">'+
          '<div class="wb-check'+(sel?' sel':'')+'" data-wb-action="select" data-wb-id="'+escH(item.id)+'"></div>'+
          '<div class="wb-body">'+
            '<div class="wb-top">'+
              (item.qNum ? '<span class="wb-qnum">'+escH(item.qNum)+'</span>' : '')+
              (item.subType ? '<span class="wb-subtype">'+escH(item.subType)+'</span>' : '')+
              (item.reviewPriority ? '<span class="wb-priority '+escH(item.reviewPriority.level)+'">'+escH(item.reviewPriority.label)+'</span>' : '')+
              '<span class="wb-date">'+(item.date||'').slice(5)+'</span>'+
            '</div>'+
            '<div class="wb-stem">'+escH(item.summary || item.stem.substring(0, 150))+'</div>'+
          '</div>'+
          '<span class="wb-expand'+(expanded?' open':'')+'" style="align-self:center"><i data-lucide="chevron-right" style="width:14px;height:14px"></i></span>'+
        '</div>'+
        (expanded ? renderDetail(item) : '')+

    });

    html += '<button data-wb-action="load-more" style="height:42px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">继续加载（已显示 '+visibleItems.length+' / '+items.length+'）</button>';
  }

  listEl.innerHTML = html;
  lucide.createIcons();
}

function renderDetail(item) {
  var h = '<div class="wb-detail open" id="detail-'+escH(item.id)+'">';

  // Correct / Wrong answer badges
  if (item.correctAns || item.wrongAns) {
    h += '<div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">';
    if (item.correctAns) {
      h += '<span class="correct-badge">✓ 正确答案 ' + escH(item.correctAns) + '</span>';
    }
    if (item.wrongAns && item.wrongAns !== item.correctAns) {
      h += '<span class="wrong-badge">✗ 你的选择 ' + escH(item.wrongAns) + '</span>';
    }
    h += '</div>';
  }

  // Render the full question stem
  if (item.stem) {
    h += '<div class="section-label">原题</div>';
    h += '<div class="md-content md-body">' + mdRender(item.stem) + '</div>';
  }

  // Reason
  if (item.reason) {
    h += '<div class="section-label">错因分析</div>';
    h += '<div class="md-content md-body">' + mdRender(item.reason) + '</div>';
  }

  // Analysis / fix (正解)
  if (item.analysis) {
    h += '<div class="section-label">正解</div>';
    h += '<div class="md-content md-body">' + mdRender(item.analysis) + '</div>';
  }

  // Tips
  if (item.tips) {
    h += '<div class="section-label">技巧</div>';
    h += '<div class="md-content md-body">' + mdRender(item.tips) + '</div>';
  }

  // Fallback: render fullText if no structured data at all
  if (!item.stem && !item.reason && !item.analysis && !item.tips && item.fullText) {
    h += '<div class="md-content md-body">' + mdRender(item.fullText) + '</div>';
  }

  // @see reference link
  if (item.seeRef) {
    h += '<div style="margin-top:10px"><button data-wb-action="see-ref" data-wb-file="'+
      escH(item.seeRef.file)+'" data-wb-qnum="'+escH(item.seeRef.qNum)+'" style="font-size:12px;padding:6px 14px;border:1px solid var(--accent);border-radius:16px;background:var(--accent-soft);color:var(--accent);cursor:pointer;font-family:inherit"><i data-lucide="external-link" style="width:13px;height:13px;vertical-align:middle;margin-right:3px"></i>在原题中查看</button></div>';
  }

  h += '</div>';
  return h;
}

function mdRender(text) {
  return API.md(text);
}

function openSeeRef(file, qNum) {
  // file format: 练习/模块/YYYY-MM-DD.md or just 模块/YYYY-MM-DD.md
  var parts = file.replace(/\.md$/, '').split('/');
  var mod = parts.length >= 2 ? parts[parts.length-2] : '';
  var date = parts[parts.length-1] || '';
  if (mod) localStorage.setItem('mp-target-module', mod);
  if (date) localStorage.setItem('mp-practice-date', date);
  localStorage.setItem('mp-practice-mode', 'direct');
  if (qNum) localStorage.setItem('mp-practice-qnum', qNum);
  API.pushPage('practice-card');
}

    '<div style="display:flex;gap:8px">'+
      '<button id="del-cancel" style="flex:1;height:42px;border:none;border-radius:10px;background:var(--bg);color:var(--text-secondary);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">取消</button>'+
      '<button id="del-confirm" style="flex:1;height:42px;border:none;border-radius:10px;background:var(--red);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">确认删除</button>'+
    '</div>';

  mask.appendChild(box);
  document.body.appendChild(mask);

  function dismiss() { mask.remove(); }
  mask.onclick = function(e) { if (e.target === mask) dismiss(); };
  document.getElementById('del-cancel').onclick = dismiss;
  document.getElementById('del-confirm').onclick = function() {
    var deletedCount = selItems.size;
    var deletedIds = Array.from(selItems);
    // Group items by their source module file so we can rewrite each wrongbook .md
    var byModule = {};
    allItems.forEach(function(item) {
      if (selItems.has(item.id)) {
        var mk = item.module || '错题回顾';
        if (!byModule[mk]) byModule[mk] = [];
        byModule[mk].push(item);
      }
    });
    allItems = allItems.filter(function(item) { return !selItems.has(item.id); });
    selItems.clear(); selAll = false;
    dismiss();
    applyFilter();
    API.toast('已删除 ' + deletedCount + ' 道错题');
    // Persist deletions to the server wrongbook files (was only mutating the in-memory
    // array, so deleted items reappeared on next load — audit #5)
    (async function() {
      try {
        var index = await API.fetchJSON('索引/错题索引.json');
        if (index && index.items) {
          var deletedSet = new Set(deletedIds);
          index.items = index.items.filter(function(item) { return item && !deletedSet.has(item.id); });
          index.updated_at = new Date().toISOString();
          await API.writeFile('索引/错题索引.json', JSON.stringify(index, null, 2));
        }
      } catch(e) { console.warn('[deleteSelected] index', e); }
      for (var mod in byModule) {
        try {
          var text = await API.fetchText('错题本/' + mod + '.md');
          if (!text) continue;
          // Each item's id encodes its source line; remove the matching section.
          // Items from parseModuleFile carry their original markdown block in item.rawBlock
          // when available; otherwise we drop by qNum/date match.
          var toRemove = byModule[mod];
          toRemove.forEach(function(it) {
            if (it.rawBlock && text.indexOf(it.rawBlock) >= 0) {
              // Remove the raw block + any trailing/leading whitespace around it
              text = text.replace(it.rawBlock, '');
            } else if (it.qNum && it.date) {
              // Fallback: remove by header match ### Q{num} | ... | {date}
              var headerRe = new RegExp('\\n*###\\s+' + it.qNum + '\\s*[|｜].*?[|｜]\\s*' + it.date.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[^\\n]*[\\s\\S]*?(?=\\n###\\s+Q\\d+|\\s*$)', 'm');
              text = text.replace(headerRe, '');
            }
          });
          await API.writeFile('错题本/' + mod + '.md', text);
        } catch(e) { console.warn('[deleteSelected] persist', mod, e); }
      }
    })();
  };
}

async function redoSelected() {
  if (!selItems.size) { API.toast('请先选择错题'); return; }
  var items = allItems.filter(function(item) { return selItems.has(item.id); });
  var mods = []; items.forEach(function(i) { if (mods.indexOf(i.module) < 0) mods.push(i.module); });
  var mod = mods[0] || '言语理解';
  var qNums = items.map(function(i) { return i.qNum; }).filter(Boolean);

  localStorage.setItem('mp-target-module', mod);
  API.openAIChat('错题重做 模块：' + mods.join('、') + ' 错题：' + qNums.join(' ') + '（日期：' + API.getLocalDate() + '）');
}

// ===== Menu Dropdown =====
function toggleWbMenu(e) {
  if (e) e.stopPropagation();
  var m = document.getElementById('menu-dd');
  var wasOpen = m.classList.contains('show');
  document.querySelectorAll('.menu-dd.show').forEach(function(x) { x.classList.remove('show'); });
  if (!wasOpen) {
    renderMenu();
    m.classList.add('show');
    setTimeout(function() {
      document.addEventListener('click', function close() {
        m.classList.remove('show');
        document.removeEventListener('click', close);
      });
    }, 0);
  }
}

function closeWbMenu() {
  var m = document.getElementById('menu-dd'); if (m) m.classList.remove('show');
}

function updateMenuBtn() {
  // Update menu if open — check the .show class (menu uses class, not inline display) (audit #15)
  var dd = document.getElementById('menu-dd');
  if (dd && dd.classList.contains('show')) renderMenu();
}

function renderMenu() {
  var sel = selItems.size;
  var items = [
    { label: '刷新', icon: 'refresh-cw', action: 'refresh' },
    { label: selAll ? '取消全选' : '全选', icon: 'check-square', action: 'select-all' },
    { label: '重做选中' + (sel ? ' ('+sel+')' : ''), icon: 'rotate-ccw', action: 'redo', disabled: !sel },
    { label: '删除选中' + (sel ? ' ('+sel+')' : ''), icon: 'trash-2', action: 'delete', danger: true, disabled: !sel }
  ];

  document.getElementById('menu-dd').innerHTML = items.map(function(r) {
    var style = r.danger ? ' style="color:var(--red)"' : (r.disabled ? ' style="opacity:.45;pointer-events:none"' : '');
    return '<div class="menu-dd-item" data-wb-action="menu-item" data-wb-menu="'+r.action+'"'+style+'>'+
      '<i data-lucide="'+r.icon+'"></i> '+r.label+'</div>';
  }).join('');
  lucide.createIcons();
}

// ===== Flashcard =====
function openFlashcard() {
  // Use selected items or all visible items
  var selected = allItems.filter(function(item) { return selItems.has(item.id); });
  var source = selected.length > 0 ? selected : allItems;

  if (!source.length) { API.toast('没有可用的错题'); return; }

  // Filter by SM-2 schedule
  var dueItems = source.filter(isFcDue);
  var skipped = dueItems.length === 0 ? 0 : (source.length - dueItems.length);

  var cards = dueItems.length > 0 ? dueItems : source;
  // Fisher–Yates shuffle (the old sort(random-0.5) is biased) — audit #27
  cards = cards.slice();
  for (var i = cards.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = cards[i]; cards[i] = cards[j]; cards[j] = tmp;
  }

  if (!cards.length) { API.toast('没有可用的错题'); return; }

  var idx = 0, flipped = false;
  var skippedInfo = skipped > 0 ? ' · '+skipped+'道未到复习日' : (dueItems.length === 0 && source.length > 0 ? ' · 全部未到复习日，仍可预习' : '');

  // Create overlay + dialog
  var overlay = document.createElement('div');
  overlay.className = 'fc-overlay';
  overlay.id = 'fc-overlay';

  function closeFc() {
    if (overlay.parentNode) overlay.remove();
    delete window._fcNav;
    delete window._fcMark;
    delete window._fcReset;
  }
  window._fcClose = closeFc;
  overlay.onclick = function(e) { if (e.target === overlay) closeFc(); };

  function render() {
    if (idx >= cards.length) { closeFc(); API.toast('全部复习完毕！'); return; }
    var c = cards[idx];
    var key = fcKey(c.module, c.qNum);
    var sm2 = _fcSM2.items[key];
    var sm2Info = '';
    if (sm2 && sm2.rep > 0) sm2Info = ' · 复习'+sm2.rep+'次';

    // Build back content from parsed fields
    var backHtml = '';
    // Answer row
    backHtml += '<div class="fc-ans-row">';
    if (c.correctAns) {
      backHtml += '<span class="fc-ans-correct"><i data-lucide="check-circle" style="width:14px;height:14px"></i> ' + escH(c.correctAns) + '</span>';
    }
    if (c.wrongAns && c.wrongAns !== c.correctAns) {
      backHtml += '<span class="fc-ans-wrong"><i data-lucide="x-circle" style="width:13px;height:13px"></i> 你选了 ' + escH(c.wrongAns) + '</span>';
    }
    backHtml += '</div>';
    // Error reason
    if (c.reason) {
      backHtml += '<div class="fc-section"><div class="fc-section-title err">错因分析</div><div class="fc-section-body">' + mdRender(c.reason) + '</div></div>';
    }
    // Correct approach
    if (c.analysis) {
      backHtml += '<div class="fc-section"><div class="fc-section-title fix">正解</div><div class="fc-section-body">' + mdRender(c.analysis) + '</div></div>';
    }
    // Tips
    if (c.tips) {
      backHtml += '<div class="fc-section"><div class="fc-section-title tip">技巧</div><div class="fc-section-body">' + mdRender(c.tips) + '</div></div>';
    }
    // Fallback: show fullText if nothing else
    if (!c.reason && !c.analysis && !c.tips && (c.fullText || c.stem)) {
      backHtml += '<div class="fc-section"><div class="fc-section-body">' + mdRender(c.fullText || c.stem) + '</div></div>';
    }

    overlay.innerHTML =
      '<div class="fc-dialog">'+
        '<div class="fc-dialog-header">'+
          '<i data-lucide="layers" style="width:16px;height:16px;color:var(--accent)"></i>'+
          '<span class="fc-title">闪卡 '+(idx+1)+'/'+cards.length+skippedInfo+sm2Info+'</span>'+
          '<button onclick="window._fcReset()" title="重置进度" style="font-size:10px;padding:3px 8px;border:1px solid var(--border);border-radius:10px;color:var(--text-secondary)">重置</button>'+
          '<button onclick="window._fcClose()"><i data-lucide="x" style="width:18px;height:18px"></i></button>'+
        '</div>'+
        '<div class="fc-card-area" id="fc-tap-area">'+
          '<div class="fc-card'+(flipped?' flipped':'')+'" id="fc-card-el">'+
            '<div class="fc-card-inner">'+
              '<div class="fc-front">'+
                '<div class="fc-module-tag">'+escH(c.qNum||'')+' · '+escH(c.module||'')+(c.date?' · '+(c.date||'').slice(5):'')+'</div>'+
                '<div class="fc-question">'+mdRender(c.stem || c.summary || c.fullText)+'</div>'+
              '</div>'+
              '<div class="fc-back">'+
                backHtml+
              '</div>'+
            '</div>'+
          '</div>'+
          '<div class="fc-hint"><i data-lucide="arrow-left-right" style="width:13px;height:13px;vertical-align:middle;margin-right:3px"></i>点击卡片翻面</div>'+
        '</div>'+
        '<div class="fc-nav-row">'+
          '<button onclick="window._fcNav(-1)">上一张</button>'+
          '<span class="fc-counter">'+(idx+1)+'/'+cards.length+'</span>'+
          '<button onclick="window._fcNav(1)">下一张</button>'+
        '</div>'+
        '<div class="fc-dialog-footer">'+
          '<button class="fc-again" onclick="window._fcMark(\'wrong\')">不会</button>'+
          '<button class="fc-gotit" onclick="window._fcMark(\'correct\')">已掌握</button>'+
        '</div>'+
      '</div>';

    lucide.createIcons();

    // Tap to flip
    var tapArea = document.getElementById('fc-tap-area');
    var cardEl = document.getElementById('fc-card-el');
    if (tapArea && cardEl) {
      tapArea.onclick = function(e) {
        if (e.target.closest('button')) return;
        if (_fcSwiping) { _fcSwiping = false; return; } // swallow synthetic click after a swipe
        e.stopPropagation(); // prevent overlay.onclick from closing
        flipped = !flipped; cardEl.classList.toggle('flipped', flipped);
      };
      var sx = 0, sy = 0;
      var _fcSwiping = false;
      tapArea.addEventListener('touchstart', function(e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; _fcSwiping = false; }, {passive:true});
      tapArea.addEventListener('touchend', function(e) {
        var dx = e.changedTouches[0].clientX - sx;
        var dy = e.changedTouches[0].clientY - sy;
        // Only swipe horizontally (dx > dy) to avoid interfering with scroll
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
          _fcSwiping = true;
          e.preventDefault();   // suppress the synthesized click that could flip/close (audit #8)
          e.stopPropagation();
          flipped = false; idx = dx > 0 ? Math.max(0, idx-1) : Math.min(cards.length-1, idx+1); render();
        }
      }, {passive:false});
    }
  }

  // Navigation functions on window so inline onclick can reach them
  window._fcNav = function(dir) {
    flipped = false;
    idx = Math.max(0, Math.min(cards.length-1, idx+dir));
    render();
  };

  window._fcMark = function(result) {
    var item = cards[idx];
    if (!item) return;
    var key = fcKey(item.module, item.qNum);
    var entry = _fcSM2.items[key];
    if (!entry) entry = { rep: 0, interval: 0, ef: 2.5, nextReview: '', module: '', qNum: '' };

    if (result === 'correct') {
      if (entry.rep === 0) entry.interval = 1;
      else if (entry.rep === 1) entry.interval = 3;
      else if (entry.rep === 2) entry.interval = 7;
      else entry.interval = Math.round(entry.interval * entry.ef);
      entry.rep++;
      entry.ef = Math.max(1.3, entry.ef + 0.1);
    } else {
      // Wrong answer: per SM-2, lower the easiness factor and reset the schedule.
      // Previously ef only ever increased, so all cards' intervals grew unboundedly (audit #21).
      entry.interval = 0;
      entry.rep = 0;
      entry.ef = Math.max(1.3, entry.ef - 0.2);
    }
    var nd = new Date(); nd.setDate(nd.getDate() + (entry.interval || 0));
    entry.nextReview = API.getLocalDate(nd);
    entry.module = item.module;
    entry.qNum = item.qNum;
    _fcSM2.items[key] = entry;
    saveFcSM2();

    if (result === 'correct') {
      // Mastered — remove from this session's deck
      cards.splice(idx, 1);
      if (cards.length === 0) {
        closeFc();
        API.toast('全部复习完毕！');
        return;
      }
      if (idx >= cards.length) idx = cards.length - 1;
    } else {
      // Got it wrong — re-queue to the end of this session's deck so it shows again (audit #21).
      // Don't splice; just move it to the back.
      cards.splice(idx, 1);
      cards.push(item);
    }
    flipped = false;
    render();
  };

  window._fcReset = function() {
    API.confirm('重置进度', '将清空所有闪卡的复习记录，确定？此操作不可撤销。', function() {
      _fcSM2 = { items: {} };
      saveFcSM2();
      closeFc();
      openFlashcard();
    });
  };

  document.body.appendChild(overlay);
  render();
}

// ===== Helpers =====
function escH(s) { return API._esc(s); }
function escQ(s) { return API.escapeJs(s); }

// ===== Init =====
// Default select all (matching desktop)
function selectAllDefault() {
  var filtered = getFilteredItems();
  filtered.forEach(function(i) { selItems.add(i.id); });
}
// Override loadFromServer to auto-select after loading
var _origLoadFromServer = loadFromServer;
loadFromServer = async function() {
  await _origLoadFromServer();
  selectAllDefault();
  updateAllChecks();
};
function updateAllChecks() {
  document.querySelectorAll('.wb-check').forEach(function(el) {
    var row = el.closest('[id^="wi-"]');
    var id = row ? row.id.replace('wi-', '') : '';
    if (id) el.classList.toggle('sel', selItems.has(id));
  });
}
API.PageRuntime.mountController('wrongbook', document, {
  mount: function(root, addCleanup) {
    var handler = function(e) {
      var target = e.target.closest('[data-wb-action]');
      if (!target) return;
      var action = target.getAttribute('data-wb-action');
      if (action === 'select' || action === 'see-ref' || action === 'menu') e.stopPropagation();
      if (action === 'today') e.preventDefault();

      if (action === 'tasks') API.openTaskPanel();
      else if (action === 'filter') openFilterSheet();
      else if (action === 'flashcard') openFlashcard();
      else if (action === 'menu') toggleWbMenu(e);
      else if (action === 'today') toggleTodayFilter();
      else if (action === 'practice') API.switchTab('practice');
      else if (action === 'detail') toggleDetail(target.getAttribute('data-wb-id') || '');
      else if (action === 'select') toggleSel(target.getAttribute('data-wb-id') || '');
      else if (action === 'load-more') loadMoreWrongItems();
      else if (action === 'see-ref') openSeeRef(target.getAttribute('data-wb-file') || '', target.getAttribute('data-wb-qnum') || '');
      else if (action === 'clear-filter') {
        var filter = target.getAttribute('data-wb-filter');
        if (filter === 'mod') filterMod = '';
        else if (filter === 'subtype') filterSubType = '';
        else if (filter === 'time') filterTime = 'all';
        applyFilter();
      } else if (action === 'menu-item') {
        var menu = target.getAttribute('data-wb-menu');
        closeWbMenu();
        if (menu === 'refresh') loadWrongBook();
        else if (menu === 'select-all') toggleSelectAll();
        else if (menu === 'redo') redoSelected();
        else if (menu === 'delete') deleteSelected();
      }
    };
    root.addEventListener('click', handler);
    addCleanup(function() { root.removeEventListener('click', handler); });
  }
});
try { loadWrongBook(); } catch(e) { console.error('[wrongbook] init error:', e); }
</script>
