<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>公考辅导 - 考点精讲</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Search */
  .search-wrap { position:relative;margin-bottom:10px; }
  .search-wrap input { width:100%;height:48px;padding:0 100px 0 18px;border:1.5px solid var(--border);border-radius:14px;font-size:15px;background:var(--surface);color:var(--text);font-family:inherit;outline:none;box-sizing:border-box;transition:border-color .2s; }
  .search-wrap input:focus { border-color:var(--accent); }
  .search-wrap input::placeholder { color:var(--text-secondary);opacity:.4; }
  .search-wrap button { position:absolute;right:4px;top:4px;height:40px;padding:0 18px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit; }

  /* Module bar */
  .mod-bar { display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none; }
  .mod-bar::-webkit-scrollbar { display:none; }
  .mod-pill { padding:7px 14px;border-radius:18px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--text-secondary);flex-shrink:0;transition:.15s; }
  .mod-pill.active { background:var(--accent);color:#fff;font-weight:600; }
  .mod-pill:not(.active) { background:var(--surface); }

  /* Section title */
  .sec { margin-bottom:16px; }
  .sec-head { display:flex;align-items:center;gap:6px;margin-bottom:10px; }
  .sec-head h3 { font-size:15px;font-weight:700;color:var(--text);margin:0; }
  .sec-head .badge { font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600; }
  .sec-head .badge.danger { background:rgba(255,69,58,.12);color:var(--red); }

  /* Weak points */
  .weak-card { background:var(--surface);border-radius:16px;padding:18px;box-shadow:var(--card-shadow);margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s; }
  .weak-card:active { transform:scale(.98); }
  .weak-rank { width:36px;height:36px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0; }
  .weak-rank.danger { background:rgba(255,69,58,.12);color:var(--red); }
  .weak-rank.warn { background:rgba(240,160,48,.12);color:var(--orange); }
  .weak-rank.info { background:var(--accent-soft);color:var(--accent); }
  .weak-body { flex:1;min-width:0; }
  .weak-name { font-size:14px;font-weight:600;color:var(--text); }
  .weak-meta { font-size:11px;color:var(--text-secondary);margin-top:2px;display:flex;align-items:center;gap:6px; }
  .weak-bar { height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden; }
  .weak-bar-fill { height:100%;border-radius:2px;transition:width .4s; }
  .weak-empty { text-align:center;padding:28px 16px;color:var(--text-secondary);font-size:13px;line-height:1.6; }

  /* Keep the module selector and knowledge tree stable when weak points grow */
  .study-page { min-height:0; }
  .study-controls {
    position: sticky;
    top: calc(44px + env(safe-area-inset-top));
    z-index: 9;
    flex-shrink: 0;
    margin: 0 -16px;
    padding: 4px 16px 0;
    background: var(--bg);
    box-shadow: 0 8px 14px rgba(0,0,0,.10);
  }
  body.light .study-controls { box-shadow: 0 8px 14px rgba(245,246,250,.92); }
  .study-page .sec-head { flex-shrink:0; }
  #weak-sec { position:relative; z-index:1; flex:0 0 auto; min-height:0; margin-top:2px; }
  #weak-list { max-height:min(30vh, 260px); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:1px 2px 2px; }
  #weak-list .weak-card:last-child { margin-bottom:0; }
  .weak-meta { flex-wrap:wrap;line-height:1.35; }
  @media (max-height:700px) {
    #weak-list { max-height:22vh; }
    .weak-card { padding:14px; }
  }

  /* Tree */
  .tree-item { background:var(--surface);border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:var(--card-shadow); }
  .tree-hdr { padding:14px 16px;display:flex;align-items:center;gap:8px;cursor:pointer; }
  .tree-hdr .th-name { flex:1;font-size:14px;font-weight:700;color:var(--text); }
  .tree-hdr .th-count { font-size:11px;color:var(--text-secondary); }
  .tree-hdr .th-arrow { transition:.2s;color:var(--text-secondary); }
  .tree-item.open .th-arrow { transform:rotate(180deg); }
  .tree-body { display:none;padding:0 16px 14px;max-height:43vh;overflow-y:auto;-webkit-overflow-scrolling:touch; }
  .tree-item.open .tree-body { display:block; }

  .tree-group { margin-bottom:10px; }
  .tree-gname { font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;opacity:.7;text-transform:uppercase;letter-spacing:.5px; }
  .tree-tags { display:flex;flex-wrap:wrap;gap:6px; }
  .tp-tag { padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;background:var(--bg);color:var(--text);transition:.15s;display:inline-flex;align-items:center;gap:4px; }
  .tp-tag:active { background:var(--accent-soft);color:var(--accent); }
  .tp-err { font-size:9px;background:var(--red);color:#fff;min-width:14px;height:14px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600; }
</style>
</head>
<body>
<div class="page study-page">
  <div class="navbar" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:6px">
      <button data-study-action="back"><i data-lucide="arrow-left"></i></button>
      <i data-lucide="graduation-cap" style="color:var(--accent);width:20px;height:20px"></i>
      <span class="title">考点精讲</span>
    </div>
    <div class="navbar-actions">
      <button data-task-bell data-study-action="task" style="position:static"><i data-lucide="bell"></i><span class="task-badge"></span></button>
    </div>
  </div>

  <div class="study-controls">
    <!-- Search -->
    <div class="search-wrap">
      <input id="search-input" placeholder="搜索考点或输入疑问...">
      <button data-study-action="learn-input">开始学习</button>
    </div>

    <!-- Module bar -->
    <div class="mod-bar" id="mod-bar"></div>
  </div>

  <!-- Weak points -->
  <div class="sec" id="weak-sec">
    <div class="sec-head">
      <h3>薄弱考点</h3>
      <span class="badge danger" id="weak-badge"></span>
    </div>
    <div id="weak-list"></div>
  </div>

  <!-- Knowledge tree -->
  <div class="sec">
    <div class="sec-head"><h3>知识体系</h3></div>
    <div id="tree-area"></div>
  </div>
</div>

<div class="tabs"></div>

<script src="lucide.js"></script>
<script src="common.js"></script>
<script>
(function() {
API.initPage('study');

var MODULES = API.XC_MODULES.concat(['申论']);
var activeMod = localStorage.getItem('mp-study-topic') || '';
var wrongMap = {};
var profile = {};
var knowledgeTree = {}; // Loaded from 知识体系.json

function $(id) { return document.getElementById(id); }

async function init() {
  await Promise.all([loadWrongData(), loadProfile(), loadKnowledgeTree()]);
  renderModBar();
  renderWeakPoints();
  renderTree();
  lucide.createIcons();
}

async function loadWrongData() {
  var results = await Promise.all(MODULES.map(async function(mod) {
    try {
      var txt = await API.fetchText('错题本/' + mod + '.md');
      if (!txt) return [];
      var items = [];
      var secs = txt.split(/\n(?=###\s+Q\d+)/);
      secs.forEach(function(sec) {
        var h = sec.match(/^###\s+Q\d+\s*[|｜]\s*(.+?)\s*[|｜]/);
        if (h) items.push(h[1].trim());
      });
      return items;
    } catch(e) { return []; }
  }));
  wrongMap = {};
  results.forEach(function(items) { items.forEach(function(kp) { wrongMap[kp] = (wrongMap[kp]||0) + 1; }); });
}

async function loadProfile() {
  try { profile = await API.fetchJSON('能力画像.json') || {}; } catch(e) {}
}

var _defaultTree = {
  '判断推理':{'逻辑判断':['直言命题','假言推理','削弱加强'],'图形推理':['位置规律','样式规律','属性规律'],'定义判断':['关键词匹配','要件提取'],'类比推理':['语义关系','逻辑关系']},
  '言语理解':{'逻辑填空':['语境分析','词语辨析'],'片段阅读':['主旨概括','意图判断'],'语句表达':['语句排序','语句填空']},
  '资料分析':{'核心概念':['增长量','增长率','比重'],'速算技巧':['估算法','直除法'],'综合分析':['文字材料','表格材料']},
  '数量关系':{'数学运算':['工程问题','行程问题','利润问题'],'数字推理':['等差数列','等比数列']},
  '常识判断':{'时政热点':['重大会议','重要政策'],'法律常识':['宪法','行政法'],'人文历史':['中国古代史','文学常识']},
  '申论':{'归纳概括':['概括主旨','提炼要点'],'综合分析':['词句理解','观点评价'],'提出对策':['问题识别','对策设计'],'公文写作':['通知','报告'],'申发论述':['立意审题','结构布局']}
};

async function loadKnowledgeTree() {
  try {
    var data = await API.fetchJSON('知识体系.json');
    knowledgeTree = (data && Object.keys(data).length > 0) ? data : _defaultTree;
  } catch(e) { knowledgeTree = _defaultTree; }
}

function getWeakPoints() {
  var list = [];
  var seen = {};
  MODULES.forEach(function(mod) {
    var modProfile = profile.modules && profile.modules[mod] ? profile.modules[mod] : {};
    var tree = knowledgeTree[mod] || {};
    Object.keys(tree).forEach(function(group) {
      (tree[group] || []).forEach(function(kp) {
        var p = modProfile[kp] || null;
        var attempts = p ? (p.attempts || 0) : 0;
        var prof = p ? Math.round((p.proficiency || p.accuracy || 0) * 100) : 0;
        var status = p && p.status ? p.status : '未学';
        if (status === '已掌握' && prof >= 75) return;
        var key = mod + '::' + kp;
        seen[key] = true;
        list.push({
          kp: kp,
          module: mod,
          group: group,
          count: wrongMap[kp] || 0,
          attempts: attempts,
          proficiency: prof,
          reason: attempts === 0 ? '大纲未学' : attempts < 3 ? '样本不足' : prof < 65 ? ('掌握度 ' + prof + '%') : '错题巩固',
          priority: (attempts === 0 ? 60 : attempts < 3 ? 40 : Math.max(0, 80 - prof)) + (wrongMap[kp] || 0) * 8
        });
      });
    });
  });
  for (var kp in wrongMap) {
    if (wrongMap[kp] > 0 && !Object.keys(seen).some(function(k){return k.endsWith('::'+kp)})) list.push({ kp: kp, module: '', group: '', count: wrongMap[kp], attempts: 0, proficiency: 0, reason: '错题高频', priority: wrongMap[kp] * 8 });
  }
  list.sort(function(a,b) { return b.priority - a.priority; });
  return list.slice(0, 5);
}

function renderModBar() {
  $('mod-bar').innerHTML = MODULES.map(function(m) {
    return '<div class="mod-pill'+(m===activeMod?' active':'')+'" data-study-action="module" data-module="'+API.escapeAttr(m)+'">'+m+'</div>';
  }).join('')+'<div class="mod-pill'+(activeMod?'':' active')+'" data-study-action="module" data-module="">全部</div>';
}

function selectMod(mod) { activeMod = mod; localStorage.setItem('mp-study-topic', mod); renderModBar(); renderTree(); }

function renderWeakPoints() {
  var points = getWeakPoints();
  $('weak-badge').textContent = points.length ? points.length+'个需加强' : '';
  if (!points.length) {
    $('weak-list').innerHTML = '<div class="weak-empty">完成练习和批改后<br>这里会自动显示你的薄弱考点</div>';
    return;
  }
  $('weak-list').innerHTML = points.map(function(p, i) {
    var cls = i === 0 ? 'danger' : i < 3 ? 'warn' : 'info';
    var label = i === 0 ? '最弱' : i < 3 ? '较弱' : '注意';
    return '<div class="weak-card" data-study-action="learn" data-topic="'+API.escapeAttr(p.kp)+'">'+
      '<div class="weak-rank '+cls+'">'+(i+1)+'</div>'+
      '<div class="weak-body">'+
        '<div class="weak-name">'+esc(p.kp)+'</div>'+
        '<div class="weak-meta"><span>'+esc(p.module || '考点')+'</span><span>'+esc(p.reason)+'</span>'+(p.count?'<span>错'+p.count+'次</span>':'')+'<span style="color:var(--red)">'+label+'</span></div>'+
        '<div class="weak-bar"><div class="weak-bar-fill" style="width:'+Math.max(10,100-p.count*15)+'%;background:'+(i===0?'var(--red)':i<3?'var(--orange)':'var(--accent)')+'"></div></div>'+
      '</div>'+
      '<i data-lucide="chevron-right" style="width:14px;height:14px;color:var(--border);flex-shrink:0"></i>'+
    '</div>';
  }).join('');
}

function renderTree() {
  var mods = activeMod ? [activeMod] : MODULES;
  var html = '';
  mods.forEach(function(mod) {
    var tree = knowledgeTree[mod];
    if (!tree) return;
    var totalKps = Object.values(tree).reduce(function(s,g){return s+g.length;},0);
    html += '<div class="tree-item'+(activeMod?' open':'')+'">'+
      '<div class="tree-hdr" data-study-action="toggle-tree">'+
        '<span class="th-name">'+mod+'</span>'+
        '<span class="th-count">'+totalKps+'个考点</span>'+
        '<i data-lucide="chevron-down" class="th-arrow" style="width:16px;height:16px"></i></div>'+
      '<div class="tree-body">';
    for (var group in tree) {
      html += '<div class="tree-group"><div class="tree-gname">'+group+'</div><div class="tree-tags">';
      tree[group].forEach(function(kp) {
        var errs = wrongMap[kp]||0;
        html += '<span class="tp-tag" data-study-action="learn" data-topic="'+API.escapeAttr(kp)+'">'+kp+
          (errs>0?' <span class="tp-err">'+errs+'</span>':'')+'</span>';
      });
      html += '</div></div>';
    }
    html += '</div></div>';
  });
  $('tree-area').innerHTML = html;
  lucide.createIcons();
}

function learn(topic) {
  topic = (topic||'').trim();
  if (!topic) return;
  $('search-input').value = topic;
  var mod = activeMod || '';
  if (!mod) {
    for (var m in knowledgeTree) {
      for (var g in knowledgeTree[m]) {
        if (knowledgeTree[m][g].indexOf(topic) >= 0) { mod = m; break; }
      }
      if (mod) break;
    }
  }
  var errs = wrongMap[topic]||0;
  var errHint = errs > 0 ? '这道题我已经错了'+errs+'次，请帮我重点分析易错点。' : '';
  var msg = '我想系统学习公考'+(mod?mod+'的':'')+'考点：'+topic+'。'+errHint+'\n\n'+
    '请像一位耐心的私人辅导老师那样教我。风格上：\n'+
    '- 用通俗语言讲解概念、方法和常见陷阱\n'+
    '- 给一道典型例题并展示解题思路\n'+
    '- 讲的过程中自然地问我问题，比如"这里理解了吗？""你觉得这个选项为什么不对？"\n'+
    '- 根据我的回答判断掌握程度，适当深入或补充\n'+
    '- 鼓励我多思考，但不要反复追问让人有压力\n'+
    '- 整体氛围轻松积极，多用肯定和引导，少用评判';
  API.openAIChat(msg);
}

function toggleTree(hdr) {
  var item = hdr.parentElement;
  var wasOpen = item.classList.contains('open');
  item.classList.toggle('open');
  if (!wasOpen) {
    setTimeout(function() { item.scrollIntoView({behavior:'smooth',block:'start'}); }, 50);
  }
}

function esc(s) { return API._esc(s); }
init();
(function() {
  var root = document.querySelector('.subpage-overlay') || document;
  API.PageRuntime.mountController('push:study', root, {
    mount: function(_, addCleanup) {
      var onClick = function(e) {
        var target = e.target.closest('[data-study-action]');
        if (!target || !root.contains(target)) return;
        var action = target.getAttribute('data-study-action');
        if (action === 'back') API.goBack();
        else if (action === 'task') API.openTaskPanel();
        else if (action === 'learn-input') learn($('search-input').value);
        else if (action === 'module') selectMod(target.getAttribute('data-module') || '');
        else if (action === 'learn') learn(target.getAttribute('data-topic') || '');
        else if (action === 'toggle-tree') toggleTree(target);
      };
      var onKeydown = function(e) {
        if (e.key === 'Enter' && e.target && e.target.id === 'search-input') learn(e.target.value);
      };
      document.addEventListener('click', onClick);
      document.addEventListener('keydown', onKeydown);
      addCleanup(function() {
        document.removeEventListener('click', onClick);
        document.removeEventListener('keydown', onKeydown);
      });
    }
  });
})();
})();
</script>
</body>
</html>
